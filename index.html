    switch (sc) {
      case "setup": return setupHtml(g);
      case "title":
        return '<div class="titlepage"><h1>' + esc(C.title) + '</h1><p class="titlepage__sub">' + esc(C.subtitle) + "</p>" +
          '<div class="titlepage__rule"></div>' + C.scenario.map(function (t) { return p(t, "scen"); }).join("") + "</div>";
      case "hook":
        return kicker(C.acts.opening) + '<h2 class="question">' + esc(C.hook.question) + "</h2>" + voteCards(g) + voteAfter(g);
      case "branches":
        return kicker(C.acts.opening) + "<h2>" + esc(C.branches.title) + '</h2><div class="branches">' + C.branches.items.map(function (b) {
          return '<div class="branch">' + D.seal(b.author, 170) + "<p><strong>" + esc(b.name) + "</strong> — " + esc(b.line) + "</p></div>";
        }).join("") + '</div><p class="closing">' + esc(C.branches.closing) + "</p>";
      case "bills":
        if (!g.bill) return tabKicker(actKicker("I")) + "<h2>" + esc(C.bills.question) + "</h2>" + voteCards(g, "cards--bills") + voteAfter(g);
        // The result: the Bill has moved into the Law Book; the chamber fills and ENACTED lands.
        return kicker(actKicker("I")) + '<div class="enact">' + D.hemicycle(true) + '<div class="enact__row"><p class="enact__title">' +
          esc(C.bills[g.bill].title) + "</p>" + D.stamp("ENACTED", { land: true, scale: 1.8, salt: "enact" }) + "</div></div>" + voteAfter(g);
      case "list": case "check":
        return kicker(actKicker("II")) + p(C.minister.header, "lead") +
          "<h2>" + esc(sc === "list" ? C.minister.listQuestion : C.minister.checkQuestion) + "</h2>" + voteCards(g, "cards--stack") + voteAfter(g);
      case "gap": {
        var X = C.actExtra;
        var h = tabKicker(actKicker("III")) + '<header class="boardroom__head">' + D.seal("GLIMMER", 48) + "<h2>" + esc(X.boardroom) + "</h2></header>" +
          p(C.gap.prompt, "boardroom__prompt") + voteCards(g, "cards--stack");
        if (!g.move) return h + voteAfter(g);
        return h + '<div class="result">' + D.stamp(g.moveResult, { land: true, scale: 1.1, salt: "gap" }) + '<div class="result__text">' +
          (g.moveResult === "CAUGHT" ? p(C.caught.note) : "") + voteAfter(g) + "</div></div>";
      }
      case "unseal": {
        var u = '<div class="unseal">';
        if (!g.sealed) u += D.charter(g.constitution, false);
        else if (!g.opened) u += D.envelope(false);
        else u += D.envelope(true) + D.charter(g.constitution, true);
        return kicker(actKicker("IV")) + u + "</div>";
      }
      case "case1": {
        // Once the ruling is recorded, the arguments give way to the Held line.
        var cs = C.cases[MODEL.case1For(g.bill)], held1 = MODEL.heldClause(g, 1);
        return tabKicker(actKicker("IV")) + D.caseFolder({
          ref: cs.ref, name: cs.name, facts: cs.facts, held: heldLine(cs.name, held1), type: true,
          args: held1 ? [] : [{ who: C.cases.claimantSays, text: cs.claimant }, { who: C.cases.governmentSays, text: cs.government }]
        }) + voteCards(g, "cards--stack") + splitLine(g) + voteAfter(g);
      }
      case "case2": {
        var c2 = C.case2, h2 = tabKicker(actKicker("IV")) + D.caseFolder({
          ref: c2.ref, name: c2.name, facts: c2.question[g.move], held: heldLine(c2.name, MODEL.heldClause(g, 2)), type: true
        }) + voteCards(g, "cards--stack");
        if (!(g.case2 && g.case2.ruling)) return h2 + voteAfter(g);
        return h2 + '<div class="result">' + D.stamp(g.case2.ruling === "purposive" ? "CAUGHT" : "LOOPHOLE", { land: true, scale: 1.3, salt: "case2" }) +
          '<div class="result__text">' + p(c2.options[g.case2.ruling].result) + splitLine(g) + voteAfter(g) + "</div></div>";
      }
      case "nocase":
        return kicker(actKicker("IV")) + '<div class="nocase">' + D.seal("COURT", 96) + p(MODEL.ruleVoid(g) ? C.noRule.card : C.noCase) + "</div>";
      case "clerk": {
        var d = g.clerkCard.decisions;
        return D.clerkCard({
          kicker: actKicker(g.clerkCard.act),
          decisions: Object.keys(d).map(function (k) {
            var x = decisionExtra(g, k, d[k]);
            return { label: C.clerkExtra.labels[k], text: decisionText(g, k, d[k]), note: x.note, html: x.html };
          }),
          reason: C.clerk.reasons[g.clerkCard.act]
        });
      }
    }
    return closeHtml(g);
  }

  // Monday Morning: the Veritas Gazette front page (spec §4.5, §9.3 item 7).
  function gazetteHtml(g) {
    var C = CONTENT, esc = D.esc, gs = MODEL.glimmerStatus(g);
    var counts = MODEL.authorship(MODEL.lawBook(g));
    return '<article class="gz" aria-label="' + esc(C.gazette.masthead) + '">' +
      '<header class="gz__mast"><span class="gz__date">' + esc(C.acts.monday) + '</span><h1 class="gz__name">' + esc(C.gazette.masthead) +
      '</h1><span class="gz__date gz__date--r">' + esc(C.title) + "</span></header>" +
      '<div class="gz__top"><h2 class="gz__headline">' + esc(C.headlines[MODEL.headline(g)]) + "</h2>" + D.authorshipRow(counts, 34) + "</div>" +
      '<figure class="gz__plate">' + D.parliamentBuilding() + "</figure>" +
      '<div class="gz__fold" aria-hidden="true"></div>' +
      lawBookView(g, [], true) +
      '<aside class="gz__note"><div class="gz__note-head">' + D.seal("GLIMMER", 40) + "<h3>" + esc(C.glimmerStatus.heading) + "</h3></div>" +
      (gs === "NO_RULE" ? "" : D.stamp(gs === "CLOSED_BY_COURT" ? "CAUGHT" : gs, { salt: "gz", scale: 0.9 })) + p(C.glimmerStatus[gs]) + "</aside></article>";
  }

  // Same choices, three countries (spec §4.5): rows from MODEL.threeCountries.
  function countriesHtml(g) {
    var C = CONTENT, CO = C.countries, cols = MODEL.threeCountries(g);
    function row(label, f) { return { label: label, cells: cols.map(f) }; }
    var rows = [
      row(CO.rows.options, function (c) { return CO.options[c.id]; }),
      row(CO.rows.case1, function (c) { return C.rulings[c.case1].label; })
    ];
    rows.push(row(C.countriesExtra.rightsRow, function (c) { return C.countriesExtra.rights[c.id]; }));
    if (g.case2 && g.case2.ruling) rows.push(row(C.countriesExtra.case2Row, function (c) { return C.case2.options[c.case2].label; }));
    rows.push(row(CO.rows.ageCheck, function (c) { return CO.ageCheck[c.id]; }));
    return tabKicker(C.acts.monday) + "<h2>" + D.esc(CO.title) + "</h2>" +
      D.countriesTable(cols.map(function (c) { return { label: CO.columns[c.id], live: c.live }; }), rows) +
      '<div class="countries__foot">' + p(C.countriesExtra.liveKey, "countries__key") + p(C.disclaimer, "disclaimer") + "</div>";
  }

  // The Close: re-vote, discussion question, End (spec §4.6).
  var endElapsed = null;
  function closeHtml(g) {
    var C = CONTENT, X = C.closeExtra, esc = D.esc;
    switch (g.screen) {
      case "gazette": return gazetteHtml(g);
      case "countries": return countriesHtml(g);
      case "revote":
        return kicker(C.acts.close) + '<h2 class="question">' + esc(C.close.revote) + "</h2>" +
          D.tallyCompare(C.hook.options, g.hook, MACHINE.counts(g), "tally", { before: X.before, after: X.after });
      case "discussion":
        if (g.discussion == null) {
          return kicker(C.acts.close) + "<h2>" + esc(X.discussionHeading) + '</h2><div class="cards cards--stack">' +
            MACHINE.discussionChoices(g).map(function (i) {
              return D.optionCard({ letter: MACHINE.LETTERS[i], text: C.close.discussion[i], value: String(i), action: "select" });
            }).join("") + "</div>";
        }
        return kicker(C.acts.close) + '<div class="discussion"><p class="discussion__q">' + esc(C.close.discussion[g.discussion]) + "</p></div>";
      case "end":
        return '<div class="endpage"><h1>' + esc(C.title) + '</h1><p class="titlepage__sub">' + esc(C.subtitle) + "</p>" +
          p(C.outcome, "outcome") +
          '<section class="data"><h2 class="data__label">' + esc(X.dataLabel) + "</h2>" +
          '<pre class="data__line tw" data-data-line>' + esc(MODEL.toData(g, endElapsed)) + "</pre>" +
          '<div class="data__actions">' + btn(X.copy, "copy-data") + btn(C.close.restart, "confirm-ask", "restart") +
          (state.ui.copy ? '<p class="data__note" role="status">' + esc(state.ui.copy === "copied" ? X.copied : X.selected) + "</p>" : "") +
          "</div></section></div>";
    }
    return "";
  }

  // Facilitator script panel (spec §7.4): what to say, timing, one likely question. Under A, Case 1 adds the lock question.
  // On the hook and the re-vote the class is voting, so the projected panel leaves out the answer (it is in the printed notes).
  function scriptHtml(g) {
    var C = CONTENT, X = C.actExtra, e = C.script[g.screen];
    if (!e) return "";
    var q = e.q, a = e.a, say = e.say;
    if (g.screen === "case1" && g.constitution === "B" && e.qB) { q = e.qB; a = e.aB; }
    if (g.screen === "nocase" && MODEL.ruleVoid(g)) { say = e.sayVoid; q = e.qVoid; a = e.aVoid; }
    var rows = [[X.timing, e.timing], [X.say, say]];
    if (g.screen === "case1" && g.constitution === "A") rows.push([X.ask, C.lockQuestion]);
    if (g.screen === "gap" && g.moveResult === "COMPLIED") rows.push([X.ask, e.askComplied]);
    rows.push([X.likely, q]);
    if (g.screen !== "hook" && g.screen !== "revote") rows.push([X.answer, a]);
    return '<section class="script" aria-label="' + D.esc(X.script) + '"><dl>' + rows.map(function (r) {
      return "<dt>" + D.esc(r[0]) + "</dt><dd>" + D.esc(r[1]) + "</dd>";
    }).join("") + "</dl></section>";
  }

  function hint(g) {
    var N = CONTENT.nav, sc = g.screen;
    if (sc === "hook") return N.hintHook;
    if (sc === "revote") return CONTENT.closeExtra.hintRevote;
    if (sc === "discussion") return g.discussion == null ? fill(CONTENT.closeExtra.hintDiscussion, { n: MACHINE.discussionChoices(g).length }) : CONTENT.closeExtra.hintDiscussionPicked;
    if (sc === "unseal" && g.sealed && !g.opened) return CONTENT.actExtra.hintUnseal;
    if (MACHINE.isVote(sc) && !MACHINE.decision(g)) return g.tie ? N.hintTie : N.hintVote;
    return "";
  }

  function footHtml(g) {
    var C = CONTENT, ui = state.ui, act = MACHINE.ACT_OF[g.screen];
    if (ui.confirm) {
      var skip = ui.confirm === "skip";
      var msg = skip ? fill(C.clerk.confirm, { act: act }) + (act === "IV" ? " " + C.clerk.warnIV : "") : C.closeExtra.restartConfirm;
      return '<div class="confirm" role="group"><span class="confirm__msg">' + D.esc(msg) + "</span>" +
        btn(skip ? C.clerkExtra.yes : C.closeExtra.restartYes, skip ? "skipAct" : "restart", null, "btn--primary", "data-autofocus") +
        btn(C.clerkExtra.no, "confirm-no") + "</div>";
    }
    var h = btn(C.nav.back, "back") + (g.screen !== "end" ? btn(C.nav.next, "next", null, "btn--primary") : "");
    h += '<span class="foot__hint">' + D.esc(hint(g)) + "</span>";
    h += btn(C.actExtra.scriptButton, "script-toggle", null, null, 'aria-pressed="' + !!ui.script + '"');
    if (canSkip(g)) h += btn(C.clerk.button + " " + C.nav.skipKey, "confirm-ask", "skip", "btn--skip");
    return h;
  }

  // Teacher notes (spec §12): replaces the whole page; the same markup prints.
  function renderNotes(app) {
    if (app.__view === "notes") return;
    app.__view = "notes";
    app.__game = false;
    app.className = "is-notes";
    app.innerHTML = D.teacherNotes();
    var first = app.querySelector("button");
    if (first) first.focus();
  }

  function renderGame(app) {
    var g = state.game;
    app.__view = null;
    if (!app.__game) {
      app.__game = true;
      app.className = "is-game";
      app.innerHTML = '<div class="game"><header class="chrome" data-region="chrome"></header>' +
        '<main class="game__main" data-region="main"><section class="stage" data-region="stage"></section><aside data-region="book"></aside></main>' +
        '<div data-region="script"></div><footer class="foot" data-region="foot"></footer></div>';
    }
    function region(k) { return app.querySelector('[data-region="' + k + '"]'); }
    var chrome = region("chrome"), main = region("main"), book = region("book"), foot = region("foot");
    var place = placeOf(g), setup = g.screen === "setup";

    chrome.hidden = setup;
    if (!setup) {
      if (!chrome.__mounted) {
        chrome.__mounted = true;
        D.idScope("c");
        chrome.innerHTML = D.ribbon() + '<div data-part="plate"></div>' + D.clock(elapsed(), true);
      }
      setRibbon(chrome.querySelector(".ribbon"), STAGE_OF.hasOwnProperty(place) ? STAGE_OF[place] : -1);
      var role = ROLE_OF[place];
      D.idScope("p");
      patch(chrome.querySelector('[data-part="plate"]'), role ? D.rolePlate(role[0], role[1]) : "");
    }

    // Stage and Law Book are patched separately, so a tally change does not re-land the Law Book's stamps.
    // From Monday Morning on, the Law Book lives on the Gazette's front page instead.
    var showBook = !!g.bill && !CLOSE_SCREENS[g.screen];
    // The DATA line's elapsed time is fixed when the End screen is reached.
    if (g.screen !== "end") endElapsed = null; else if (endElapsed == null) endElapsed = elapsed();
    main.classList.toggle("has-book", showBook);
    main.classList.toggle("is-court", showBook && isCourt(g));
    main.classList.toggle("is-folder", g.screen === "case1" || g.screen === "case2");
    book.hidden = !showBook;
    // Glossary links: the first use of each term on the screen, reading the Law Book (left) and then the stage.
    // Setup is for the facilitator, so it carries none.
    var seen = {};
    function linked(html) { return setup ? html : D.linkTerms(html, seen); }
    D.idScope("b");
    var bookBefore = book.__html;
    patch(book, showBook ? linked(lawBookView(g, freshKeys(g))) : "");
    // If the Law Book is too long for its column, bring the line that has just landed into view.
    if (book.__html !== bookBefore) {
      var landed = book.querySelectorAll(".prov--new");
      try { if (landed.length) landed[landed.length - 1].scrollIntoView({ block: "nearest" }); } catch (e) { /* a nicety */ }
    }
    var stage = region("stage");
    D.idScope("s");
    stage.classList.toggle("stage--dense", place === "gap" || isCourt(g));
    patch(stage, linked(stageHtml(g)));
    var script = region("script");
    script.hidden = !state.ui.script;
    patch(script, script.hidden ? "" : scriptHtml(g));
    D.idScope("");
    // The label's value stays out of the markup, so committing it (on blur) does not rebuild Setup
    // between mousedown and click on Start.
    var label = stage.querySelector('[data-field="label"]');
    if (label && label !== document.activeElement && label.value !== g.label) label.value = g.label;
    foot.hidden = setup;
    patch(foot, setup ? "" : footHtml(g));
    if (state.ui.confirm && !foot.contains(document.activeElement)) {
      var yes = foot.querySelector("[data-autofocus]");
      if (yes) yes.focus();
    }
  }

  var SLOTS = ["chrome", "tokens", "seals", "stamps", "cards", "tally", "lawBook", "folders", "envelope", "glossary", "themes"];
  var TOKENS = ["paper", "paper-2", "paper-3", "ink", "ink-2", "rule", "parl", "min", "court", "biz", "stamp", "force", "tape"];
  var AUTHORS = ["PARL", "MIN", "COURT", "GLIMMER", "CLERK"];

  function renderGallery(app) {
    var G = CONTENT.gallery, g = state.gallery, S = G.sections;
    if (!app.__gallery) {
      app.__gallery = true;
      app.__html = null;
      app.innerHTML = '<div class="gallery"><header><h1>' + D.esc(G.title) + '</h1><p class="gallery__note">' + D.esc(G.intro) +
        '</p><div class="gallery__bar"><button type="button" class="btn" data-action="theme-toggle">' + D.esc(G.themeButton) +
        '</button><button type="button" class="btn" data-action="glossary-toggle">' + D.esc(G.glossaryButton) + "</button></div></header>" +
        SLOTS.map(function (k) { return '<section><h2>' + D.esc(S[k]) + '</h2><div data-slot="' + k + '"></div></section>'; }).join("") +
        "</div>";
    }
    function slot(k) { return app.querySelector('[data-slot="' + k + '"]'); }

    // Chrome: the ribbon is mounted once so the tape can untie between stages.
    var chrome = slot("chrome");
    if (!chrome.__mounted) {
      chrome.__mounted = true;
      chrome.innerHTML = '<div class="gallery__bar"><button type="button" class="btn" data-action="g-stage" data-delta="-1">' + D.esc(G.prevStage) +
        '</button><button type="button" class="btn" data-action="g-stage" data-delta="1">' + D.esc(G.nextStage) + "</button></div>" +
        '<div class="chrome">' + D.ribbon() + '<div data-part="plate"></div>' + D.clock(elapsed(), true) + "</div>" +
        '<p class="gallery__note">' + D.esc(G.clockNote) + '</p><div class="gallery__row">' + D.clock(724) + D.clock(1500) + D.clock(1800) + "</div>";
    }
    setRibbon(chrome.querySelector(".ribbon"), g.stage);
    patch(chrome.querySelector('[data-part="plate"]'), D.rolePlate(STAGE_ROLES[g.stage][0], STAGE_ROLES[g.stage][1]));

    patch(slot("tokens"), '<div class="gallery__swatches">' + TOKENS.map(function (t) {
      return '<div class="gallery__swatch"><span class="gallery__chip" style="background:var(--' + t + ')"></span><code>--' + t + "</code></div>";
    }).join("") + "</div>");

    patch(slot("seals"), '<div class="gallery__row">' + AUTHORS.map(function (a) {
      return '<figure class="gallery__fig">' + D.seal(a, 200) + "<figcaption>" + a + "</figcaption></figure>";
    }).join("") + '</div><div class="gallery__row">' + AUTHORS.map(function (a) { return D.seal(a, 64) + D.seal(a, 40); }).join("") + "</div>");

    patch(slot("stamps"), '<div class="gallery__bar"><button type="button" class="btn" data-action="g-replay">' + D.esc(G.replay) +
      '</button></div><div class="gallery__stamps" data-n="' + g.landN + '">' +
      Object.keys(CONTENT.stamps).map(function (k) { return D.stamp(k, { land: true }); }).join("") + "</div>");

    patch(slot("cards"), '<div class="cards">' + G.hookOptions.map(function (o) {
      return D.optionCard({ letter: o.letter, text: o.text, value: o.letter, action: "g-select", selected: g.selected === o.letter, land: true });
    }).join("") + "</div>");

    patch(slot("tally"), D.tallyStrip(G.hookOptions, g.tally, "g-tally"));
    patch(slot("lawBook"), D.lawBook(G.lawBook));
    patch(slot("folders"), G.folders.map(D.caseFolder).join(""));

    patch(slot("envelope"), '<div class="gallery__bar"><button type="button" class="btn" data-action="g-envelope">' +
      D.esc(g.envOpen ? G.reseal : G.crack) + '</button></div><div class="gallery__env">' + D.envelope(g.envOpen) + "</div>");

    patch(slot("glossary"), '<p class="gallery__note">' + D.esc(G.glossaryNote) + '</p><button type="button" class="btn" data-action="glossary-toggle">' +
      D.esc(G.glossaryButton) + "</button>");

    patch(slot("themes"), '<div class="gallery__themes">' + [["light", G.lightPane], ["dark", G.darkPane]].map(function (p) {
      return '<div class="gallery__pane" data-theme="' + p[0] + '"><h3>' + D.esc(p[1]) + '</h3><div class="gallery__row">' +
        AUTHORS.map(function (a) { return D.seal(a, 72); }).join("") + '</div><div class="gallery__stamps">' +
        D.stamp("ENACTED") + D.stamp("LOOPHOLE") + D.stamp("INCOMPATIBLE_IN_FORCE", { scale: 0.8 }) + "</div>" +
        D.optionCard({ letter: "C", text: G.hookOptions[2].text, value: "pane-" + p[0], action: "noop", selected: true }) +
        D.lawBook(G.lawBook.slice(1, 4)) + D.clock(1500) + D.clock(1800) + "</div>";
    }).join("") + "</div>");
  }

  function render() {
    var root = document.documentElement;
    if (state.ui.theme) root.setAttribute("data-theme", state.ui.theme); else root.removeAttribute("data-theme");
    renderGlossary();
    var app = document.getElementById("app");
    if (!document.getElementById("print-cards")) document.body.insertAdjacentHTML("beforeend", D.printSheet());
    if (state.screen === "gallery") renderGallery(app);
    else if (state.ui.view === "notes") renderNotes(app);
    else renderGame(app);
    runEnters(app);
  }

  function effectiveTheme() {
    if (state.ui.theme) return state.ui.theme;
    try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { return "light"; }
  }

  function tickClocks() {
    var sec = elapsed(), els = document.querySelectorAll("[data-clock-live]");
    for (var i = 0; i < els.length; i++) {
      els[i].className = "clock clock--" + D.clockLevel(sec);
      els[i].querySelector(".clock__time").textContent = D.formatClock(sec);
    }
  }

  // A typed count waiting to be committed (see the change listener); any click or key commits it first.
  var pendingTally = null;
  function flushTally() {
    if (!pendingTally) return;
    var a = pendingTally;
    pendingTally = null;
    dispatch(a);
  }

  document.addEventListener("click", function (e) {
    flushTally();
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var type = el.getAttribute("data-action");
    var action = { type: type };
    if (el.hasAttribute("data-delta")) action.delta = Number(el.getAttribute("data-delta"));
    if (el.hasAttribute("data-value")) action.value = el.getAttribute("data-value");
    if (el.hasAttribute("data-option")) action.option = el.getAttribute("data-option");
    if (type === "theme-toggle") action.effective = effectiveTheme();
    if (type === "start") action.date = new Date().toISOString().slice(0, 10);
    if (type === "copy-data") { copyData(); return; }
    if (type === "print-cards" || type === "print-notes") { printNow(type === "print-cards" ? "cards" : "notes"); return; }
    dispatch(action);
  });

  // Printing: body[data-print] chooses what the print stylesheet shows (the voting-card sheet, or the page itself).
  // Print is always light, whatever the theme; the attribute only matters in print, so it is cleared afterwards.
  var themeHeld = false, themeBefore = null;
  function printNow(kind) {
    document.body.setAttribute("data-print", kind);
    try { window.print(); } catch (e) { /* printing unavailable */ }
  }
  window.addEventListener("beforeprint", function () {
    var root = document.documentElement;
    if (!themeHeld) { themeHeld = true; themeBefore = root.getAttribute("data-theme"); }
    root.setAttribute("data-theme", "light");
  });
  window.addEventListener("afterprint", function () {
    var root = document.documentElement;
    document.body.removeAttribute("data-print");
    if (!themeHeld) return;
    themeHeld = false;
    if (themeBefore == null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", themeBefore);
  });

  function toggleFullscreen() {
    function quiet(r) { if (r && r.catch) r.catch(function () { /* refused: nothing to do */ }); }
    try {
      if (document.fullscreenElement) quiet(document.exitFullscreen());
      else quiet(document.documentElement.requestFullscreen());
    } catch (e) { /* fullscreen unavailable */ }
  }

  // Select the DATA line so the facilitator can press Ctrl+C. The note renders first, so the selection survives it.
  function selectData() {
    dispatch({ type: "copy-note", value: "selected" });
    try {
      var el = document.querySelector("[data-data-line]"), range = document.createRange(), sel = window.getSelection();
      range.selectNodeContents(el);
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) { /* nothing more to try */ }
  }
  function copyData() {
    var el = document.querySelector("[data-data-line]");
    if (!el) return;
    try {
      navigator.clipboard.writeText(el.textContent).then(function () { dispatch({ type: "copy-note", value: "copied" }); }, selectData);
    } catch (e) { selectData(); }
  }

  document.addEventListener("change", function (e) {
    var field = e.target.closest("[data-field]");
    if (field) { dispatch({ type: "set-" + field.getAttribute("data-field"), value: field.value }); return; }
    var el = e.target.closest("[data-tally]");
    if (!el) return;
    var v = parseInt(el.value, 10);
    // Tab fires change before focus moves on. Re-rendering after the move keeps focus on the control Tab reached.
    pendingTally = { type: state.gallery ? "g-tally" : "tally", option: el.getAttribute("data-tally"), value: isNaN(v) ? 0 : v };
    window.setTimeout(flushTally, 0);
  });

  document.addEventListener("keydown", function (e) {
    flushTally();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName, ui = state.ui, g = state.game, play = !state.gallery;
    var action = KEYS.resolve(e.key, {
      typing: tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT",
      tallyBox: !!(e.target && e.target.hasAttribute && e.target.hasAttribute("data-tally")), onButton: tag === "BUTTON",
      gallery: !!state.gallery, screen: play ? g.screen : null,
      confirm: ui.confirm, glossary: ui.glossary, view: ui.view,
      canSkip: play && canSkip(g),
      values: play ? MACHINE.options(g).map(function (o) { return o.value; }) : []
    });
    if (!action) return;
    e.preventDefault();
    if (action.type === "fullscreen") { toggleFullscreen(); return; }
    if (action.type === "tally-commit") { e.target.blur(); return; }
    if (action.type === "theme-toggle") action.effective = effectiveTheme();
    dispatch(action);
  });

  render();
  window.setInterval(tickClocks, 1000);
})();
/* APP:END */
</script>
</body>
</html>
