<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Republic of Veritas</title>

<!-- ===== BLOCK 1: STYLE ===== -->
<style>
/* ---- Tokens: light ("Vellum", default) ---- */
:root, [data-theme="light"] {
  --paper: #F2EADB;
  --paper-2: #E6D9C2;
  --paper-3: #FBF7EF;
  --ink: #1B2130;
  --ink-2: #454C5E;
  --rule: #8C7A5B;
  --parl: #2E5A3B;
  --min: #8A5A0C;
  --court: #7A1E2A;
  --biz: #57376A;
  --stamp: #B0261C;
  --force: #1E4D3A;
  --tape: #C2362B;
  color-scheme: light;
}
:root {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --typewriter: "Courier New", ui-monospace, monospace;
}
/* ---- Tokens: dark ("Night Sitting") ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161B;
    --paper-2: #1D2028;
    --paper-3: #252935;
    --ink: #ECE4D3;
    --ink-2: #B6AE9C;
    --rule: #8C7A5B;
    --parl: #7FB08D;
    --min: #D8A84E;
    --court: #D9707E;
    --biz: #B79AD0;
    --stamp: #E5574B;
    --force: #74B596;
    --tape: #E0503F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], [data-theme="dark"] {
  --paper: #14161B;
  --paper-2: #1D2028;
  --paper-3: #252935;
  --ink: #ECE4D3;
  --ink-2: #B6AE9C;
  --rule: #8C7A5B;
  --parl: #7FB08D;
  --min: #D8A84E;
  --court: #D9707E;
  --biz: #B79AD0;
  --stamp: #E5574B;
  --force: #74B596;
  --tape: #E0503F;
  color-scheme: dark;
}

/* ---- Base ---- */
html { font-size: clamp(18px, 1.15vw + 6px, 28px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}
[data-theme] { background: var(--paper); color: var(--ink); }
#app { min-height: 100vh; padding: 2rem; box-sizing: border-box; }
h1, h2, h3 {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  font-weight: normal;
  margin: 0 0 0.5rem;
}
h1 { font-size: 2.2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
button { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--ink);
  border-radius: 0;
  background: var(--paper-3);
  padding: 0.25em 0.8em;
  cursor: pointer;
}
.btn:hover { background: var(--paper-2); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tw { font-family: var(--typewriter); }
.seal { display: inline-block; vertical-align: middle; flex: none; }

/* ---- Chrome: procedure ribbon with red tape ---- */
.chrome {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.6rem 1.2rem; padding: 0.5rem 0 0.7rem; border-bottom: 3px double var(--rule);
}
.ribbon ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin: 0; padding: 0; }
.ribbon__arrow { color: var(--ink-2); }
.ribbon__stage {
  position: relative; padding: 0.15em 0.7em 0.15em 1.35em;
  border: 1px solid var(--rule); background: var(--paper-3);
  font-variant: small-caps; letter-spacing: 0.08em;
}
.ribbon__stage.is-tied { border-color: var(--ink); font-weight: bold; }
.tape { position: absolute; left: 0.4em; top: -0.3em; bottom: -0.3em; width: 0.34em; pointer-events: none; }
.tape__band {
  position: absolute; inset: 0; background: var(--tape);
  transform: scaleY(0); transition: transform 380ms ease-in;
}
.tape__knot {
  position: absolute; left: 50%; top: 50%; width: 1.25em; height: 1.55em; margin: -0.5em 0 0 -0.625em;
  overflow: visible; opacity: 0; transform: translateY(0.7em) rotate(28deg) scale(0.55);
  transition: opacity 300ms ease-in, transform 380ms ease-in;
}
.is-tied .tape__band { transform: scaleY(1); transition: transform 300ms ease-out 260ms; }
.is-tied .tape__knot { opacity: 1; transform: none; transition: opacity 200ms ease-out 480ms, transform 260ms ease-out 480ms; }

/* ---- Chrome: role plate ---- */
.plate {
  display: flex; align-items: center; gap: 0.5em;
  border: 3px double var(--rule); background: var(--paper-3); padding: 0.15em 0.8em 0.15em 0.3em;
}
.plate__kicker { display: block; font-size: 0.8em; color: var(--ink-2); font-variant: small-caps; letter-spacing: 0.08em; }
.plate__role { display: block; font-size: 1.05em; line-height: 1.2; }

/* ---- Chrome: clock (brass at 25:00, oxblood at 30:00; rule weight also changes) ---- */
.clock {
  font-variant-numeric: tabular-nums; padding: 0.1em 0.5em; border: 1px solid transparent;
  white-space: nowrap;
}
.clock__limit { color: var(--ink-2); }
.clock--brass { color: var(--min); border: 1px solid var(--min); }
.clock--oxblood { color: var(--court); border: 3px double var(--court); font-weight: bold; }
.clock--brass .clock__limit, .clock--oxblood .clock__limit { color: inherit; }

/* ---- Glossary drawer ---- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 92vw); box-sizing: border-box;
  background: var(--paper-3); color: var(--ink); border-left: 3px double var(--rule);
  padding: 1.2rem 1.4rem; overflow: auto; z-index: 20;
  transform: translateX(105%); visibility: hidden;
  transition: transform 220ms ease-in, visibility 0s linear 220ms;
}
.drawer.is-open { transform: none; visibility: visible; transition: transform 220ms ease-out, visibility 0s; }
.drawer__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 3px double var(--ink); margin-bottom: 0.8rem; }
.drawer__head h2 { margin: 0; }
.drawer__head h2:focus { outline: none; }

/* ---- Rubber stamps ---- */
.stamp { display: inline-block; vertical-align: middle; overflow: visible; transform: rotate(var(--rot, -6deg)); }
.stamp--land { animation: stamp-land 250ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
@keyframes stamp-land {
  0%   { opacity: 0; transform: rotate(var(--rot)) scale(1.35); }
  64%  { opacity: 1; transform: rotate(var(--rot)) scale(1); }
  80%  { transform: rotate(var(--rot)) translate(0, 2px); }
  100% { transform: rotate(var(--rot)); }
}

/* ---- Option cards ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
.card {
  position: relative; display: flex; gap: 0.7em; align-items: flex-start; text-align: left;
  padding: 1em 1.6em 1em 1.1em; background: var(--paper-3); border: 1px solid var(--ink-2); border-radius: 0;
  font-size: 1rem; line-height: 1.3; cursor: pointer;
}
.card.is-selected { border: 4px solid var(--ink); padding: calc(1em - 3px) calc(1.6em - 3px) calc(1em - 3px) calc(1.1em - 3px); }
.card__mark { flex: none; }
.card__tick { position: absolute; right: -0.5em; top: -0.7em; }
.shape { width: 1.7em; height: 1.7em; display: inline-block; vertical-align: middle; }

/* ---- Vote tally strip ---- */
.tally {
  display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem; align-items: center;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0.45rem 0;
}
.tally__item { display: flex; align-items: center; gap: 0.3em; }
.tally__btn {
  width: 1.6em; height: 1.6em; padding: 0; border: 1px solid var(--ink-2); border-radius: 0;
  background: var(--paper-3); cursor: pointer; line-height: 1;
}
.tally__box {
  width: 2.6em; box-sizing: border-box; text-align: center; font: inherit; font-variant-numeric: tabular-nums;
  border: 2px solid var(--ink); border-radius: 0; background: var(--paper-3); color: var(--ink); padding: 0.1em;
  -moz-appearance: textfield; appearance: textfield;
}
.tally__box::-webkit-inner-spin-button, .tally__box::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ---- The Law Book: raised document with marginal seal gutter ---- */
.lawbook {
  position: relative; isolation: isolate;
  padding: 1rem 1.2rem 1.2rem 0; margin: 0 8px 8px 0;
}
/* Two sheets: ::before is the sheet beneath, offset; ::after is the top sheet. Stacked paper, not a shadow. */
.lawbook::before, .lawbook::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--rule); }
.lawbook::before { z-index: -2; transform: translate(7px, 7px); background: var(--paper-2); }
.lawbook::after { z-index: -1; background: var(--paper-3); }
.lawbook__head { margin-left: 5rem; border-bottom: 3px double var(--ink); padding-bottom: 0.2rem; }
.lawbook__head h2 { margin: 0; }
.lawbook__list { list-style: none; margin: 0; padding: 0; }
.prov { display: grid; grid-template-columns: 4.2rem 1fr auto; gap: 0 0.8rem; align-items: stretch; }
.prov > * { padding: 0.55rem 0; }
.prov__gutter { display: flex; justify-content: center; align-items: flex-start; border-right: 3px double var(--rule); }
.prov__body { border-bottom: 1px solid var(--rule); }
.prov__stamps { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; border-bottom: 1px solid var(--rule); min-width: 1px; }
.prov__num { font-weight: bold; margin-right: 0.3em; }
.prov--struck .prov__text { text-decoration: line-through; text-decoration-thickness: 0.12em; text-decoration-color: var(--stamp); color: var(--ink-2); }

/* ---- Case folder ---- */
.folder { position: relative; margin-top: 1.7em; background: var(--paper-2); border: 1px solid var(--rule); padding: 1rem 1.4rem 1.1rem; }
.folder__tab {
  position: absolute; top: -1.65em; left: 1.2rem; height: 1.65em; box-sizing: border-box; padding: 0.15em 1.2em 0;
  background: var(--paper-2); border: 1px solid var(--rule); border-bottom: 0;
}
.folder__name { font-style: italic; font-variant: normal; letter-spacing: 0; font-size: 1.2rem; }
.folder__facts { margin: 0 0 0.6rem; }
.folder__args { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.4rem 1.2rem; margin: 0; }
.folder__args dt { font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.folder__args dd { margin: 0; }
.held { display: flex; gap: 0.6em; align-items: baseline; margin: 1rem 0 0; }
.held__label { font-variant: small-caps; letter-spacing: 0.08em; font-weight: bold; }
.held__line { flex: 1; min-height: 1.4em; border-bottom: 1px solid var(--ink); }

/* ---- Wax-sealed envelope ---- */
.env { display: block; width: min(100%, 24rem); }
.env svg { display: block; width: 100%; height: auto; overflow: visible; }
.env__crack { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 300ms ease-in, opacity 150ms linear 320ms; }
.env--open .env__crack { stroke-dashoffset: 0; opacity: 0; }
.env__waxA, .env__waxB { transform-box: fill-box; transform-origin: 50% 50%; transition: transform 250ms ease-out 300ms; }
.env--open .env__waxA { transform: translate(4px, -5px) rotate(6deg); }
.env--open .env__waxB { transform: translate(-3px, 6px) rotate(-5deg); }
.env__flap { transform-box: fill-box; transform-origin: 50% 0; transition: transform 500ms ease-in-out 600ms; }
.env--open .env__flap { transform: scaleY(-1); }

/* ---- Reduced motion: stamps fade only; everything else changes instantly ---- */
@media (prefers-reduced-motion: reduce) {
  .stamp--land { animation: stamp-fade 200ms ease-out both; }
  @keyframes stamp-fade { from { opacity: 0; } to { opacity: 1; } }
  .tape__band, .tape__knot, .is-tied .tape__band, .is-tied .tape__knot,
  .drawer, .drawer.is-open, .env__crack, .env__waxA, .env__waxB, .env__flap { transition: none; }
}

/* ---- Review gallery (?gallery=1) ---- */
.gallery section { margin: 2.2rem 0; }
.gallery__bar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 0.6rem 0; }
.gallery__note { color: var(--ink-2); max-width: 48rem; }
.gallery__row { display: flex; flex-wrap: wrap; gap: 1.6rem 2rem; align-items: center; }
.gallery__fig { margin: 0; text-align: center; }
.gallery__fig figcaption { color: var(--ink-2); font-size: 0.85em; }
.gallery__stamps { display: flex; flex-wrap: wrap; gap: 1.6rem 2.4rem; align-items: center; padding: 0.8rem 0.4rem; }
.gallery__swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 0.6rem; }
.gallery__swatch { display: flex; align-items: center; gap: 0.5em; font-size: 0.85em; }
.gallery__chip { width: 1.6em; height: 1.6em; border: 1px solid var(--ink); flex: none; }
.gallery__themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1rem; }
.gallery__pane { padding: 1rem 1.2rem; border: 1px solid var(--rule); }
.gallery__pane > * + * { margin-top: 1rem; }
.gallery__env { padding-top: 7rem; }
</style>
</head>

</svg>

/* ===== BLOCK 4: MODEL ===== */
/* MODEL:START */
const MODEL = (function () {
  // Seeded PRNG (mulberry32). Returns a function yielding floats in [0, 1).
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Stable 32-bit string hash (FNV-1a). Returns an unsigned integer.
  function hashString(str) {
    var h = 0x811C9DC5;
    str = String(str);
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  return { mulberry32: mulberry32, hashString: hashString };
})();
/* MODEL:END */

/* DESIGN:START */
// "Chancery & Seal" component builders. Each returns an HTML/SVG string.
// No DOM access here, so tests can load this block in node:vm.
const DESIGN = (function () {
  var TAU = Math.PI * 2;
  var uidCount = 0;

  // Per-instance ids keep each SVG's own patterns and clip paths self-contained,
  // so currentColor (and the theme) resolves where the SVG sits.
  function uid(prefix) { uidCount += 1; return "vx" + prefix + uidCount; }
  function n1(x) { return (Math.round(x * 10) / 10).toString(); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  function pathFrom(pts) {
    var d = "M" + n1(pts[0][0]) + " " + n1(pts[0][1]);
    for (var i = 1; i < pts.length; i++) d += "L" + n1(pts[i][0]) + " " + n1(pts[i][1]);
    return d + "Z";
  }

  // Hypotrochoid x = (R-r)cos t + d cos((R-r)t/r), y = (R-r)sin t - d sin((R-r)t/r),
  // remapped radially so the whole curve fills the annulus [rin, rout] about (cx, cy).
  function hypotrochoid(R, r, d, rin, rout, phase, cx, cy) {
    var g = gcd(R, r), turns = r / g, k = (R - r) / r;
    var lo = R - r - d, hi = R - r + d;
    var steps = 32 * ((R - r) / g + turns);
    var pts = [];
    for (var i = 0; i < steps; i++) {
      var t = TAU * turns * i / steps;
      var x = (R - r) * Math.cos(t) + d * Math.cos(k * t);
      var y = (R - r) * Math.sin(t) - d * Math.sin(k * t);
      var rho = Math.sqrt(x * x + y * y);
      var th = Math.atan2(y, x) + phase;
      var rr = rin + (rho - lo) / (hi - lo) * (rout - rin);
      pts.push([cx + rr * Math.cos(th), cy + rr * Math.sin(th)]);
    }
    return pathFrom(pts);
  }

  // Sine "barleycorn" rim wave between two circles.
  function rimWave(n, mid, amp, phase) {
    var steps = n * 16, pts = [];
    for (var i = 0; i < steps; i++) {

      case "theme-toggle": return assign(s, { ui: assign(ui, { theme: a.effective === "dark" ? "light" : "dark" }) });
    }
    if (!g) return s;
    switch (a.type) {
      case "g-stage": return assign(s, { gallery: assign(g, { stage: clamp(g.stage + a.delta, 0, 4) }) });
      case "g-select": return assign(s, { gallery: assign(g, { selected: a.value }) });
      case "g-tally":
        t = assign(g.tally, {});
        t[a.option] = Math.max(0, a.value != null ? a.value : (t[a.option] || 0) + a.delta);
        return assign(s, { gallery: assign(g, { tally: t }) });
      case "g-replay": return assign(s, { gallery: assign(g, { landN: g.landN + 1 }) });
      case "g-envelope": return assign(s, { gallery: assign(g, { envOpen: !g.envOpen }) });
    }
    return s;
  }

  function dispatch(action) {
    var next = reduce(state, action);
    if (next === state) return state;
    if (!UI_ACTIONS[action.type]) next = assign(next, { history: state.history.concat([state]) });
    state = next;
    render();
    return state;
  }

  // Replace an element's markup only when it changed; keep focus on the same control.
  function patch(el, html) {
    if (el.__html === html) return;
    var active = document.activeElement;
    var key = active && el.contains(active) ? active.getAttribute("data-focus") : null;
    el.innerHTML = html;
    el.__html = html;
    if (key) {
      var again = el.querySelector('[data-focus="' + key + '"]');
      if (again) again.focus();
    }
  }

  // Elements marked data-enter="cls" receive cls after insertion, so CSS transitions run.
  function runEnters(root) {
    var els = root.querySelectorAll("[data-enter]");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], cls = el.getAttribute("data-enter");
      el.removeAttribute("data-enter");
      void el.getBoundingClientRect();
      el.classList.add(cls);
    }
  }

  function elapsed() { return (Date.now() - startedAt) / 1000; }

  function setRibbon(nav, index) {
    var stages = nav.querySelectorAll(".ribbon__stage");
    for (var i = 0; i < stages.length; i++) {
      var tied = i === index;
      stages[i].classList.toggle("is-tied", tied);
      if (tied) stages[i].setAttribute("aria-current", "step"); else stages[i].removeAttribute("aria-current");
    }
  }

  var glossaryReturn = null;
  function renderGlossary() {
    var el = document.getElementById("glossary");
    if (!el) {
      el = document.createElement("aside");
      el.id = "glossary";
      el.className = "drawer";
      el.setAttribute("aria-labelledby", "glossary-title");
      el.innerHTML = D.glossaryDrawer();
      document.body.appendChild(el);
    }
    var open = state.ui.glossary, was = el.classList.contains("is-open");
    if (open === was) return;
    el.classList.toggle("is-open", open);
    if (open) {
      glossaryReturn = document.activeElement;
      el.querySelector("#glossary-title").focus();
    } else if (glossaryReturn && glossaryReturn.focus) {
      glossaryReturn.focus();
      glossaryReturn = null;
    }
  }

  function renderTitle(app) {
    app.__gallery = false;
    patch(app, "<h1>" + D.esc(CONTENT.title) + "</h1><p>" + D.esc(CONTENT.subtitle) + "</p>");
  }

  var SLOTS = ["chrome", "tokens", "seals", "stamps", "cards", "tally", "lawBook", "folders", "envelope", "glossary", "themes"];
  var TOKENS = ["paper", "paper-2", "paper-3", "ink", "ink-2", "rule", "parl", "min", "court", "biz", "stamp", "force", "tape"];
  var AUTHORS = ["PARL", "MIN", "COURT", "GLIMMER", "CLERK"];

  function renderGallery(app) {
    var G = CONTENT.gallery, g = state.gallery, S = G.sections;
    if (!app.__gallery) {
      app.__gallery = true;
      app.__html = null;
      app.innerHTML = '<div class="gallery"><header><h1>' + D.esc(G.title) + '</h1><p class="gallery__note">' + D.esc(G.intro) +
        '</p><div class="gallery__bar"><button type="button" class="btn" data-action="theme-toggle">' + D.esc(G.themeButton) +
        '</button><button type="button" class="btn" data-action="glossary-toggle">' + D.esc(G.glossaryButton) + "</button></div></header>" +
        SLOTS.map(function (k) { return '<section><h2>' + D.esc(S[k]) + '</h2><div data-slot="' + k + '"></div></section>'; }).join("") +
        "</div>";
    }
    function slot(k) { return app.querySelector('[data-slot="' + k + '"]'); }

    // Chrome: the ribbon is mounted once so the tape can untie between stages.
    var chrome = slot("chrome");
    if (!chrome.__mounted) {
      chrome.__mounted = true;
      chrome.innerHTML = '<div class="gallery__bar"><button type="button" class="btn" data-action="g-stage" data-delta="-1">' + D.esc(G.prevStage) +
        '</button><button type="button" class="btn" data-action="g-stage" data-delta="1">' + D.esc(G.nextStage) + "</button></div>" +
        '<div class="chrome">' + D.ribbon() + '<div data-part="plate"></div>' + D.clock(elapsed(), true) + "</div>" +
        '<p class="gallery__note">' + D.esc(G.clockNote) + '</p><div class="gallery__row">' + D.clock(724) + D.clock(1500) + D.clock(1800) + "</div>";
    }
    setRibbon(chrome.querySelector(".ribbon"), g.stage);
    patch(chrome.querySelector('[data-part="plate"]'), D.rolePlate(STAGE_ROLES[g.stage][0], STAGE_ROLES[g.stage][1]));

    patch(slot("tokens"), '<div class="gallery__swatches">' + TOKENS.map(function (t) {
      return '<div class="gallery__swatch"><span class="gallery__chip" style="background:var(--' + t + ')"></span><code>--' + t + "</code></div>";
    }).join("") + "</div>");

    patch(slot("seals"), '<div class="gallery__row">' + AUTHORS.map(function (a) {
      return '<figure class="gallery__fig">' + D.seal(a, 200) + "<figcaption>" + a + "</figcaption></figure>";
    }).join("") + '</div><div class="gallery__row">' + AUTHORS.map(function (a) { return D.seal(a, 64) + D.seal(a, 40); }).join("") + "</div>");

    patch(slot("stamps"), '<div class="gallery__bar"><button type="button" class="btn" data-action="g-replay">' + D.esc(G.replay) +
      '</button></div><div class="gallery__stamps" data-n="' + g.landN + '">' +
      Object.keys(CONTENT.stamps).map(function (k) { return D.stamp(k, { land: true }); }).join("") + "</div>");

    patch(slot("cards"), '<div class="cards">' + G.hookOptions.map(function (o) {
      return D.optionCard({ letter: o.letter, text: o.text, value: o.letter, action: "g-select", selected: g.selected === o.letter, land: true });
    }).join("") + "</div>");

    patch(slot("tally"), D.tallyStrip(G.hookOptions, g.tally, "g-tally"));
    patch(slot("lawBook"), D.lawBook(G.lawBook));
    patch(slot("folders"), G.folders.map(D.caseFolder).join(""));

    patch(slot("envelope"), '<div class="gallery__bar"><button type="button" class="btn" data-action="g-envelope">' +
      D.esc(g.envOpen ? G.reseal : G.crack) + '</button></div><div class="gallery__env">' + D.envelope(g.envOpen) + "</div>");

    patch(slot("glossary"), '<p class="gallery__note">' + D.esc(G.glossaryNote) + '</p><button type="button" class="btn" data-action="glossary-toggle">' +
      D.esc(G.glossaryButton) + "</button>");

    patch(slot("themes"), '<div class="gallery__themes">' + [["light", G.lightPane], ["dark", G.darkPane]].map(function (p) {
      return '<div class="gallery__pane" data-theme="' + p[0] + '"><h3>' + D.esc(p[1]) + '</h3><div class="gallery__row">' +
        AUTHORS.map(function (a) { return D.seal(a, 72); }).join("") + '</div><div class="gallery__stamps">' +
        D.stamp("ENACTED") + D.stamp("LOOPHOLE") + D.stamp("INCOMPATIBLE_IN_FORCE", { scale: 0.8 }) + "</div>" +
        D.optionCard({ letter: "C", text: G.hookOptions[2].text, value: "pane-" + p[0], action: "noop", selected: true }) +
        D.lawBook(G.lawBook.slice(1, 4)) + D.clock(1500) + D.clock(1800) + "</div>";
    }).join("") + "</div>");
  }

  function render() {
    var root = document.documentElement;
    if (state.ui.theme) root.setAttribute("data-theme", state.ui.theme); else root.removeAttribute("data-theme");
    renderGlossary();
    var app = document.getElementById("app");
    if (state.screen === "gallery") renderGallery(app); else renderTitle(app);
    runEnters(app);
  }

  function effectiveTheme() {
    if (state.ui.theme) return state.ui.theme;
    try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { return "light"; }
  }

  function tickClocks() {
    var sec = elapsed(), els = document.querySelectorAll("[data-clock-live]");
    for (var i = 0; i < els.length; i++) {
      els[i].className = "clock clock--" + D.clockLevel(sec);
      els[i].querySelector(".clock__time").textContent = D.formatClock(sec);
    }
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var type = el.getAttribute("data-action");
    var action = { type: type };
    if (el.hasAttribute("data-delta")) action.delta = Number(el.getAttribute("data-delta"));
    if (el.hasAttribute("data-value")) action.value = el.getAttribute("data-value");
    if (el.hasAttribute("data-option")) action.option = el.getAttribute("data-option");
    if (type === "theme-toggle") action.effective = effectiveTheme();
    dispatch(action);
  });

  document.addEventListener("change", function (e) {
    var el = e.target.closest("[data-tally]");
    if (!el || !state.gallery) return;
    var v = parseInt(el.value, 10);
    dispatch({ type: "g-tally", option: el.getAttribute("data-tally"), value: isNaN(v) ? 0 : v });
  });

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    if (e.key === "Escape") { dispatch({ type: "glossary-close" }); return; }
    if (typing) return;
    if (e.key === "g" || e.key === "G") { e.preventDefault(); dispatch({ type: "glossary-toggle" }); }
    else if (e.key === "d" || e.key === "D") { e.preventDefault(); dispatch({ type: "theme-toggle", effective: effectiveTheme() }); }
  });

  render();
  window.setInterval(tickClocks, 1000);
})();
/* APP:END */
</script>
</body>
</html>
