<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Republic of Veritas</title>

<!-- ===== BLOCK 1: STYLE ===== -->
<style>
:root {
  --paper: #F2EADB;
  --paper-2: #E6D9C2;
  --paper-3: #FBF7EF;
  --ink: #1B2130;
  --ink-2: #454C5E;
  --rule: #8C7A5B;
  --parl: #2E5A3B;
  --min: #8A5A0C;
  --court: #7A1E2A;
  --biz: #57376A;
  --stamp: #B0261C;
  --force: #1E4D3A;
  --tape: #C2362B;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --typewriter: "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161B;
    --paper-2: #1D2028;
    --paper-3: #252935;
    --ink: #ECE4D3;
    --ink-2: #B6AE9C;
    --parl: #7FB08D;
    --min: #D8A84E;
    --court: #D9707E;
    --biz: #B79AD0;
    --stamp: #E5574B;
  }
}
:root[data-theme="dark"] {
  --paper: #14161B;
  --paper-2: #1D2028;
  --paper-3: #252935;
  --ink: #ECE4D3;
  --ink-2: #B6AE9C;
  --parl: #7FB08D;
  --min: #D8A84E;
  --court: #D9707E;
  --biz: #B79AD0;
  --stamp: #E5574B;
}
html { font-size: clamp(18px, 1.15vw + 6px, 28px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  line-height: 1.4;
}
#app { min-height: 100vh; padding: 2rem; box-sizing: border-box; }
h1 {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  font-weight: normal;
  margin: 0 0 0.5rem;
}
</style>
</head>

<body>
<!-- ===== BLOCK 2: SVG DEFS ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="stamp-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1"/>
    </pattern>
  </defs>
</svg>

<div id="app"></div>

<script>
/* ===== BLOCK 3: CONTENT ===== */
/* CONTENT:START */
const CONTENT = {
  title: "The Republic of Veritas",
  subtitle: "Who makes the law? Should I care?"
};
/* CONTENT:END */

/* ===== BLOCK 4: MODEL ===== */
/* MODEL:START */
const MODEL = (function () {
  // Seeded PRNG (mulberry32). Returns a function yielding floats in [0, 1).
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Stable 32-bit string hash (FNV-1a). Returns an unsigned integer.
  function hashString(str) {
    var h = 0x811C9DC5;
    str = String(str);
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  return { mulberry32: mulberry32, hashString: hashString };
})();
/* MODEL:END */

/* ===== BLOCK 5: APP ===== */
/* APP:START */
(function () {
  var state = { screen: "title", history: [] };

  function dispatch(action) {
    var next = Object.assign({}, state, { history: state.history.concat([state]) });
    // Phase 0: no actions change state yet.
    state = next;
    render();
    return state;
  }

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var h1 = document.createElement("h1");
    h1.textContent = CONTENT.title;
    var p = document.createElement("p");
    p.textContent = CONTENT.subtitle;
    app.appendChild(h1);
    app.appendChild(p);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    dispatch({ type: el.getAttribute("data-action") });
  });

  render();
})();
/* APP:END */
</script>
</body>
</html>
