<!-- ===== BLOCK 1: STYLE ===== -->
<style>
/* ---- Tokens: light ("Vellum", default) ---- */
:root, [data-theme="light"] {
  --paper: #F2EADB;
  --paper-2: #E6D9C2;
  --paper-3: #FBF7EF;
  --ink: #1B2130;
  --ink-2: #454C5E;
  --rule: #8C7A5B;
  --parl: #2E5A3B;
  --min: #8A5A0C;
  --court: #7A1E2A;
  --biz: #57376A;
  --stamp: #B0261C;
  --force: #1E4D3A;
  --tape: #C2362B;
  color-scheme: light;
}
:root {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --typewriter: "Courier New", ui-monospace, monospace;
}
/* ---- Tokens: dark ("Night Sitting") ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161B;
    --paper-2: #1D2028;
    --paper-3: #252935;
    --ink: #ECE4D3;
    --ink-2: #B6AE9C;
    --rule: #8C7A5B;
    --parl: #7FB08D;
    --min: #D8A84E;
    --court: #D9707E;
    --biz: #B79AD0;
    --stamp: #E5574B;
    --force: #74B596;
    --tape: #E0503F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], [data-theme="dark"] {
  --paper: #14161B;
  --paper-2: #1D2028;
  --paper-3: #252935;
  --ink: #ECE4D3;
  --ink-2: #B6AE9C;
  --rule: #8C7A5B;
  --parl: #7FB08D;
  --min: #D8A84E;
  --court: #D9707E;
  --biz: #B79AD0;
  --stamp: #E5574B;
  --force: #74B596;
  --tape: #E0503F;
  color-scheme: dark;
}

/* ---- Base ---- */
html { font-size: clamp(18px, 1.15vw + 6px, 28px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}
[data-theme] { background: var(--paper); color: var(--ink); }
#app { min-height: 100vh; padding: 2rem; box-sizing: border-box; }
h1, h2, h3 {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  font-weight: normal;
  margin: 0 0 0.5rem;
}
h1 { font-size: 2.2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
button { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--ink);
  border-radius: 0;
  background: var(--paper-3);
  padding: 0.25em 0.8em;
  cursor: pointer;
}
.btn:hover { background: var(--paper-2); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tw { font-family: var(--typewriter); }
.seal { display: inline-block; vertical-align: middle; flex: none; }

/* ---- Chrome: procedure ribbon with red tape ---- */
.chrome {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.6rem 1.2rem; padding: 0.2rem 0 0.4rem; border-bottom: 3px double var(--rule);
}
.ribbon ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin: 0; padding: 0; }
.ribbon__arrow { color: var(--ink-2); }
.ribbon__stage {
  position: relative; padding: 0.15em 0.7em 0.15em 1.35em;
  border: 1px solid var(--rule); background: var(--paper-3);
  font-variant: small-caps; letter-spacing: 0.08em;
}
.ribbon__stage.is-tied { border-color: var(--ink); font-weight: bold; }
.tape { position: absolute; left: 0.4em; top: -0.3em; bottom: -0.3em; width: 0.34em; pointer-events: none; }
.tape__band {
  position: absolute; inset: 0; background: var(--tape);
  transform: scaleY(0); transition: transform 380ms ease-in;
}
.tape__knot {
  position: absolute; left: 50%; top: 50%; width: 1.25em; height: 1.55em; margin: -0.5em 0 0 -0.625em;
  overflow: visible; opacity: 0; transform: translateY(0.7em) rotate(28deg) scale(0.55);
  transition: opacity 300ms ease-in, transform 380ms ease-in;
}
.is-tied .tape__band { transform: scaleY(1); transition: transform 300ms ease-out 260ms; }
.is-tied .tape__knot { opacity: 1; transform: none; transition: opacity 200ms ease-out 480ms, transform 260ms ease-out 480ms; }

/* ---- Chrome: role plate ---- */
.plate {
  display: flex; align-items: center; gap: 0.5em;
  border: 3px double var(--rule); background: var(--paper-3); padding: 0.15em 0.8em 0.15em 0.3em;
}
.plate__kicker { display: block; font-size: 0.8em; color: var(--ink-2); font-variant: small-caps; letter-spacing: 0.08em; line-height: 1.15; }
.plate__role { display: block; font-size: 1.05em; line-height: 1.15; }
.plate .seal { width: 40px; height: 40px; }

/* ---- Chrome: clock (brass at 25:00, oxblood at 30:00; rule weight also changes) ---- */
.clock {
  font-variant-numeric: tabular-nums; padding: 0.1em 0.5em; border: 1px solid transparent;
  white-space: nowrap;
}
.clock__limit { color: var(--ink-2); }
.clock--brass { color: var(--min); border: 1px solid var(--min); }
.clock--oxblood { color: var(--court); border: 3px double var(--court); font-weight: bold; }
.clock--brass .clock__limit, .clock--oxblood .clock__limit { color: inherit; }

/* ---- Glossary drawer ---- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 92vw); box-sizing: border-box;
  background: var(--paper-3); color: var(--ink); border-left: 3px double var(--rule);
  padding: 1.2rem 1.4rem; overflow: auto; z-index: 20;
  transform: translateX(105%); visibility: hidden;
  transition: transform 220ms ease-in, visibility 0s linear 220ms;
}
.drawer.is-open { transform: none; visibility: visible; transition: transform 220ms ease-out, visibility 0s; }
.drawer__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 3px double var(--ink); margin-bottom: 0.8rem; }
.drawer__head h2 { margin: 0; }
.drawer__head h2:focus { outline: none; }

/* ---- Rubber stamps ---- */
.stamp { display: inline-block; vertical-align: middle; overflow: visible; transform: rotate(var(--rot, -6deg)); }
.stamp--land { animation: stamp-land 250ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
@keyframes stamp-land {
  0%   { opacity: 0; transform: rotate(var(--rot)) scale(1.35); }
  64%  { opacity: 1; transform: rotate(var(--rot)) scale(1); }
  80%  { transform: rotate(var(--rot)) translate(0, 2px); }
  100% { transform: rotate(var(--rot)); }
}

/* ---- Option cards ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
.card {
  position: relative; display: flex; gap: 0.7em; align-items: flex-start; text-align: left;
  padding: 1em 1.6em 1em 1.1em; background: var(--paper-3); border: 1px solid var(--ink-2); border-radius: 0;
  font-size: 1rem; line-height: 1.3; cursor: pointer;
}
.card.is-selected { border: 4px solid var(--ink); padding: calc(1em - 3px) calc(1.6em - 3px) calc(1em - 3px) calc(1.1em - 3px); }
.card__mark { flex: none; }
.card__tick { position: absolute; right: -0.5em; top: -0.7em; }
.shape { width: 1.7em; height: 1.7em; display: inline-block; vertical-align: middle; }

/* ---- Vote tally strip ---- */
.tally {
  display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem; align-items: center;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0.45rem 0;
}
.tally__item { display: flex; align-items: center; gap: 0.3em; }
.tally__btn {
  width: 1.6em; height: 1.6em; padding: 0; border: 1px solid var(--ink-2); border-radius: 0;
  background: var(--paper-3); cursor: pointer; line-height: 1;
}
.tally__box {
  width: 2.6em; box-sizing: border-box; text-align: center; font: inherit; font-variant-numeric: tabular-nums;
  border: 2px solid var(--ink); border-radius: 0; background: var(--paper-3); color: var(--ink); padding: 0.1em;
  -moz-appearance: textfield; appearance: textfield;
}
.tally__box::-webkit-inner-spin-button, .tally__box::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ---- The Law Book: raised document with marginal seal gutter ---- */
.lawbook {
  position: relative; isolation: isolate;
  padding: 1rem 1.2rem 1.2rem 0; margin: 0 8px 8px 0;
}
/* Two sheets: ::before is the sheet beneath, offset; ::after is the top sheet. Stacked paper, not a shadow. */
.lawbook::before, .lawbook::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--rule); }
.lawbook::before { z-index: -2; transform: translate(7px, 7px); background: var(--paper-2); }
.lawbook::after { z-index: -1; background: var(--paper-3); }
.lawbook__head { margin-left: 5rem; border-bottom: 3px double var(--ink); padding-bottom: 0.2rem; }
.lawbook__head h2 { margin: 0; }
.lawbook__list { list-style: none; margin: 0; padding: 0; }
.prov { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 0 0.8rem; align-items: stretch; }
.prov > * { padding: 0.55rem 0; }
.prov__gutter { display: flex; justify-content: center; align-items: flex-start; border-right: 3px double var(--rule); }
.prov__body { display: flow-root; border-bottom: 1px solid var(--rule); }
.prov__stamps { float: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; margin: 0 0 0.15rem 0.7rem; }
.prov__num { font-weight: bold; margin-right: 0.3em; }
.prov--brief .prov__line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prov--brief .prov__note { display: none; }
.prov--struck .prov__text { text-decoration: line-through; text-decoration-thickness: 0.12em; text-decoration-color: var(--stamp); color: var(--ink-2); }

/* ---- Case folder ---- */
.folder { position: relative; margin-top: 1.7em; background: var(--paper-2); border: 1px solid var(--rule); padding: 1rem 1.4rem 1.1rem; }
.folder__tab {
  position: absolute; top: -1.65em; left: 1.2rem; height: 1.65em; box-sizing: border-box; padding: 0.15em 1.2em 0;
  background: var(--paper-2); border: 1px solid var(--rule); border-bottom: 0;
}
.folder__name { font-style: italic; font-variant: normal; letter-spacing: 0; font-size: 1.2rem; }
.folder__facts { margin: 0 0 0.6rem; }
.folder__args { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.4rem 1.2rem; margin: 0; }
.folder__args dt { font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.folder__args dd { margin: 0; }
.held { display: flex; gap: 0.6em; align-items: baseline; margin: 1rem 0 0; }
.held__label { font-variant: small-caps; letter-spacing: 0.08em; font-weight: bold; }
.held__line { flex: 1; min-height: 1.4em; border-bottom: 1px solid var(--ink); }

/* ---- Wax-sealed envelope ---- */
.env { display: block; width: min(100%, 24rem); }
.env svg { display: block; width: 100%; height: auto; overflow: visible; }
.env__crack { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 300ms ease-in, opacity 150ms linear 320ms; }
.env--open .env__crack { stroke-dashoffset: 0; opacity: 0; }
.env__waxA, .env__waxB { transform-box: fill-box; transform-origin: 50% 50%; transition: transform 250ms ease-out 300ms; }
.env--open .env__waxA { transform: translate(4px, -5px) rotate(6deg); }
.env--open .env__waxB { transform: translate(-3px, 6px) rotate(-5deg); }
.env__flap { transform-box: fill-box; transform-origin: 50% 0; transition: transform 500ms ease-in-out 600ms; }
.env--open .env__flap { transform: scaleY(-1); }

/* ---- Reduced motion: stamps fade only; everything else changes instantly ---- */
@media (prefers-reduced-motion: reduce) {
  .stamp--land { animation: stamp-fade 200ms ease-out both; }
  @keyframes stamp-fade { from { opacity: 0; } to { opacity: 1; } }
  .tape__band, .tape__knot, .is-tied .tape__band, .is-tied .tape__knot,
  .drawer, .drawer.is-open, .env__crack, .env__waxA, .env__waxB, .env__flap { transition: none; }
}

/* ---- Game layout: chrome, main (Law Book + stage), footer ---- */
[hidden] { display: none !important; }
/* The game fits the viewport (spec §9.4): chrome and footer always show. A column scrolls on its own only as a last resort. */
#app.is-game { padding: 0.7rem 1.4rem 0.8rem; height: 100vh; overflow: hidden; }
.game { display: flex; flex-direction: column; gap: 0.6rem; height: 100%; }
.game__main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 1.4rem; align-items: start; }
.game__main > .stage, .game__main > [data-region="book"] { max-height: 100%; min-height: 0; overflow: hidden auto; box-sizing: border-box; padding: 0.2rem 0.7rem 0.5rem 0; }
/* The bottom padding takes the corners of rotated stamps, so they never cause a scrollbar on their own. */
.game__main.has-book { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); }
.game__main.has-book > [data-region="book"] { order: -1; }
.kicker { display: block; font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.lead { font-size: 1.05rem; max-width: 46rem; margin: 0.2rem 0 0.6rem; }
.stage > * + * { margin-top: 0.8rem; }
.stage h2 { margin: 0; }
.stage .cards--stack { grid-template-columns: minmax(0, 1fr); gap: 0.7rem; }
.cards--stack .card { padding: 0.6em 1.6em 0.6em 1.1em; }
.cards--stack .card.is-selected { padding: calc(0.6em - 3px) calc(1.6em - 3px) calc(0.6em - 3px) calc(1.1em - 3px); }
.card--static { cursor: default; }
.card__note { display: inline-block; margin-left: 0.6em; font-variant: small-caps; letter-spacing: 0.08em; font-weight: bold; }
.card.is-noted { border-style: dashed; border-width: 3px; }
.voice { border-left: 3px double var(--ink); padding: 0.2rem 0 0.2rem 0.8rem; font-style: italic; font-size: 1.05rem; }
.casting { border: 3px double var(--stamp); padding: 0.3rem 0.8rem; }
.casting strong { font-variant: small-caps; letter-spacing: 0.08em; }
.foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem;
  border-top: 3px double var(--rule); padding-top: 0.55rem; font-size: 0.85rem;
}
.foot__hint { flex: 1; color: var(--ink-2); min-width: 12rem; }
.btn--skip { border-color: var(--rule); color: var(--ink-2); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem; border: 3px double var(--stamp); padding: 0.3rem 0.8rem; flex: 1; }
.confirm__msg { flex: 1; min-width: 14rem; }
.btn--primary { border-width: 3px; border-style: double; font-weight: bold; }

/* ---- Setup ---- */
.setup { max-width: 52rem; margin: 1rem auto; }
.setup h1 { margin-bottom: 0; }
.setup__sub { font-style: italic; margin: 0 0 1.2rem; }
.setup fieldset { border: 1px solid var(--rule); margin: 0 0 1rem; padding: 0.6rem 1rem 0.8rem; }
.setup legend { font-variant: small-caps; letter-spacing: 0.08em; padding: 0 0.4em; }
.setup__choices { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.choice { border: 1px solid var(--ink-2); border-radius: 0; background: var(--paper-3); padding: 0.35em 0.9em; cursor: pointer; text-align: left; }
.choice[aria-pressed="true"] { border: 3px solid var(--ink); padding: calc(0.35em - 2px) calc(0.9em - 2px); font-weight: bold; }
.choice__box { display: inline-block; width: 0.7em; height: 0.7em; border: 2px solid currentColor; margin-right: 0.45em; vertical-align: 0; }
.choice[aria-pressed="true"] .choice__box { background: currentColor; }
.setup__label { display: block; margin: 0 0 1.2rem; }
.setup__label input { display: block; margin-top: 0.3rem; font: inherit; width: min(100%, 24rem); border: 2px solid var(--ink); border-radius: 0; background: var(--paper-3); color: var(--ink); padding: 0.2em 0.4em; }
.setup__actions { display: flex; flex-wrap: wrap; gap: 0.8rem; }
.setup__note { color: var(--ink-2); }

/* ---- Title ---- */
.titlepage { max-width: 50rem; margin: 6vh auto 0; text-align: center; }
.titlepage h1 { font-size: 3.2rem; margin: 0.3rem 0 0; }
.titlepage__sub { font-size: 1.6rem; font-style: italic; margin: 0.2rem 0 1rem; }
.titlepage__seals { display: flex; justify-content: center; gap: 1.2rem; margin-bottom: 0.4rem; }
.titlepage__rule { border-top: 3px double var(--rule); margin: 0 auto 1rem; width: 60%; }
.titlepage p.scen { text-align: left; margin: 0 0 0.7rem; }

/* ---- Hook ---- */
.question { font-size: 1.8rem; }

/* ---- Three branches ---- */
.branches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6rem; margin-top: 1.2rem; }
.branch { text-align: center; }
.branch p { margin: 0.6rem 0 0; font-size: 1.1rem; }
.branch strong { font-variant: small-caps; letter-spacing: 0.08em; }
.closing { margin-top: 1.6rem; padding-top: 0.8rem; border-top: 3px double var(--rule); text-align: center; font-size: 1.6rem; font-style: italic; }

/* ---- Act I: Bills set as statutes; the hemicycle on enactment ---- */
.cards--bills { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
.cards--bills .card { flex-direction: column; gap: 0.3em; padding-top: 0.7em; padding-bottom: 0.7em; }
.cards--bills .card__mark { position: absolute; top: 0.55em; right: 0.7em; }
.cards--bills .statute__title { padding-right: 1.9em; }
.statute { display: block; }
.statute__title { display: block; font-variant: small-caps; letter-spacing: 0.08em; font-size: 1.15rem; font-weight: bold; border-bottom: 3px double var(--rule); padding-bottom: 0.2em; margin-bottom: 0.3em; }
.statute__sec { display: block; margin: 0 0 0.35em; }
.statute__means { display: block; margin-top: 0.4em; padding-top: 0.3em; border-top: 1px solid var(--rule); font-style: italic; }
.statute__label { font-style: normal; font-variant: small-caps; letter-spacing: 0.08em; font-weight: bold; }
.enact { text-align: center; padding: 0.4rem 0 0; }
.enact .hemi { display: block; width: min(100%, 22rem); margin: 0 auto; }
.enact__row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.4rem 1.4rem; margin-top: 0.4rem; }
.enact__title { font-variant: small-caps; letter-spacing: 0.08em; font-size: 1.3rem; margin: 0; }
.enact__row .stamp--land { animation-delay: 950ms; }
.hemi__seat { fill: transparent; }
.hemi--fill .hemi__seat { animation: seat-fill 140ms ease-out var(--d) both; }
@keyframes seat-fill { from { fill: transparent; } to { fill: currentColor; } }
.lawbook__title { margin: 0; font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.prov--new > .prov__body { animation: prov-in 420ms ease-out both; }
@keyframes prov-in { from { opacity: 0; transform: translateX(-1.6rem); } to { opacity: 1; transform: none; } }
.lawbook--compact { padding-top: 0.6rem; padding-bottom: 0.7rem; }
.lawbook--compact .lawbook__head { margin-left: 3.8rem; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 1rem; }
.lawbook--compact .lawbook__head h2 { font-size: 1.25rem; }
.lawbook--compact .prov { grid-template-columns: 3rem minmax(0, 1fr); line-height: 1.25; }
.lawbook--compact .prov > * { padding: 0.25rem 0; }
.lawbook--compact .seal { width: 40px; height: 40px; }
.lawbook--compact .prov__stamps { gap: 0.15rem; }
.game__main.has-book.is-court { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.game__main.has-book.is-court.is-folder { grid-template-columns: minmax(0, 0.76fr) minmax(0, 1.24fr); }

/* ---- Clerk result card (reusable) ---- */
.clerk { position: relative; border: 3px double var(--ink-2); background: var(--paper-3); padding: 1rem 1.3rem 1.2rem; }
.clerk__head { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.6rem; }
.clerk__head h2 { margin: 0; }
.clerk__list { margin: 0.8rem 0 0; }
.clerk__list > div { margin-bottom: 0.5rem; }
.clerk__list dt { font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.clerk__list dd { margin: 0; font-size: 1.1rem; }
.clerk__reason { margin: 0.6rem 0 0; }
.clerk__label { font-variant: small-caps; letter-spacing: 0.08em; font-weight: bold; }
.clerk__stamp { text-align: right; margin-top: 0.4rem; }

/* ---- Act III: Glimmer's boardroom; the words that caught Glimmer ---- */
.boardroom__head { display: flex; align-items: center; gap: 0.9rem; border-bottom: 3px double var(--biz); padding-bottom: 0.4rem; }
.boardroom__head h2 { color: var(--biz); }
.boardroom__prompt { font-size: 1.15rem; margin: 0; }
.result { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.4rem; }
.result__text { margin: 0; flex: 1; min-width: 12rem; }
.result__text > * { margin: 0 0 0.3rem; }
mark.caught {
  background: transparent; color: inherit; font-weight: bold;
  border: 2px solid var(--stamp); border-bottom-width: 5px; padding: 0 0.12em;
  animation: caught-in 500ms ease-out 300ms both;
}
@keyframes caught-in { from { border-color: transparent; } to { border-color: var(--stamp); } }
.prov__note { display: block; margin-top: 0.2rem; font-style: italic; color: var(--ink-2); }

/* ---- Act IV: constitution card, locked ruling, typed Held line ---- */
/* The opened flap rises above the envelope, so the envelope column keeps headroom for it. */
.unseal { display: flex; align-items: flex-start; gap: 1.2rem; }
.unseal .env { flex: none; width: min(100%, 10rem); margin-top: 3.5rem; }
.unseal .charter { flex: 1; min-width: 0; }
.unseal .charter h2 { font-size: 1.3rem; }
.charter { border: 3px double var(--court); background: var(--paper-3); padding: 0.8rem 1.2rem 1rem; }
.charter h2 { margin: 0.1rem 0 0; }
.charter__inspired { margin: 0 0 0.5rem; font-style: italic; color: var(--ink-2); }
.charter__summary { margin: 0; font-size: 1.15rem; }
.charter--reveal { animation: charter-in 400ms ease-out 1100ms both; }
@keyframes charter-in { from { opacity: 0; transform: translateY(0.8rem); } to { opacity: 1; transform: none; } }
.card--locked { cursor: not-allowed; background: var(--paper-2); border: 2px dashed var(--ink-2); color: var(--ink-2); }
.card__lock { display: flex; gap: 0.5em; align-items: flex-start; margin-top: 0.35em; color: var(--ink); font-style: italic; }
.padlock { width: 1.3em; height: 1.55em; flex: none; }
/* Acts III and IV carry the most on one screen: tighter rhythm and card padding. */
.stage--dense > * + * { margin-top: 0.45rem; }
.stage--dense .cards--stack { gap: 0.4rem; }
.stage--dense .cards--stack .card { padding: 0.38em 1.6em 0.38em 1.1em; align-items: center; }
.stage--dense .cards--stack .card.is-selected { padding: calc(0.38em - 3px) calc(1.6em - 3px) calc(0.38em - 3px) calc(1.1em - 3px); }
.stage--dense .card__mark .shape { width: 1.5em; height: 1.5em; }
.stage--dense .tally { padding: 0.3rem 0; }
/* On case screens the act kicker shares the row of the folder's tab. */
.stage > .kicker--tabrow { text-align: right; height: 0; }
.stage .folder__args dt, .stage .folder__args dd { display: inline; }
.stage .folder__args dt { margin-right: 0.4em; }
.stage .folder { margin-top: 1.85rem; padding: 0.55rem 1.2rem 0.65rem; }
.stage .folder .held { margin-top: 0.3rem; }
.stage .folder__facts { margin-bottom: 0.4rem; }
.held { align-items: first baseline; }
.held__text { display: block; }
.held__text--type { animation: type-in 1400ms steps(40, end) 200ms both; }
@keyframes type-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.split { font-weight: bold; }
.split__dissent { font-weight: normal; font-style: italic; }
.stage--dense .folder__name { font-size: 1.1rem; margin-bottom: 0.2rem; }
.nocase { display: flex; gap: 1rem; align-items: flex-start; border: 3px double var(--court); background: var(--paper-3); padding: 1rem 1.2rem; font-size: 1.25rem; }
.nocase p { margin: 0; }
.clerk__note { display: block; font-size: 0.85em; font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.clerk__list dd .stamp { margin: 0.3rem 0 0 0.4rem; }

/* ---- Monday Morning: the Veritas Gazette (broadsheet: main column + side column) ---- */
.gz { display: grid; grid-template-columns: minmax(0, 1fr) 10rem; gap: 0 1.2rem; background: var(--paper-3); border: 1px solid var(--rule); padding: 0.2rem 1rem 0.3rem; }
.gz__mast {
  grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
  border-top: 3px double var(--ink); border-bottom: 3px double var(--ink); padding: 0.1rem 0;
}
.gz__name { margin: 0; font-size: 1.9rem; line-height: 1.1; letter-spacing: 0.14em; font-weight: bold; text-align: center; }
.gz__date { font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.gz__date--r { text-align: right; }
.gz__top { display: flex; flex-direction: column; justify-content: center; gap: 0.25rem; padding: 0.35rem 0 0.3rem; min-width: 0; }
.gz__headline { margin: 0; font-size: 1.65rem; line-height: 1.1; font-weight: bold; font-variant: normal; letter-spacing: 0.02em; }
/* The engraving takes the height of the headline block beside it, so it never pushes the Law Book down. */
.gz__plate { position: relative; margin: 0 0 0 -1.2rem; border-left: 1px solid var(--rule); }
.gz__plate svg { position: absolute; inset: 0.3rem 0 0.3rem 1.2rem; width: calc(100% - 1.2rem); height: calc(100% - 0.6rem); }
.gz__fold { grid-column: 1 / -1; border-top: 1px dashed var(--rule); margin: 0 0 0.45rem; }
.gz .lawbook { grid-column: 1 / -1; margin-bottom: 0; padding-top: 0.2rem; padding-bottom: 0.35rem; }
.gz .lawbook__list { columns: 2; column-gap: 1.4rem; }
.gz .prov { break-inside: avoid; }
.gz .lawbook--compact .lawbook__head { gap: 1rem; }
.gz .lawbook--compact .lawbook__head h2 { line-height: 1.15; }
.gz .lawbook--compact .prov { line-height: 1.22; }
.gz .lawbook--compact .prov > * { padding: 0.14rem 0; }
.gz .prov__stamps { gap: 0.1rem; }
.gz .prov__note { margin-top: 0.05rem; }
/* Glimmer: a marginal note beside the Law Book, not a line in it (a business is not a law-maker). */
.gz__note { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 1rem; border-top: 1px solid var(--rule); margin-top: 0.5rem; padding-top: 0.3rem; }
.gz__note-head { display: flex; align-items: center; gap: 0.5rem; margin: 0; }
.gz__note h3 { margin: 0; font-size: 1rem; line-height: 1.2; color: var(--biz); font-variant: normal; letter-spacing: 0; font-weight: bold; }
.gz__note p { margin: 0; font-style: italic; flex: 1; min-width: 14rem; }
/* Authorship line, as a row of seals. */
.authors { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.6rem; margin: 0; }
.authors__lead { font-style: italic; }
.authors__item { display: inline-flex; align-items: center; gap: 0.4em; }
.authors__n { font-size: 1.5rem; font-weight: bold; font-variant-numeric: tabular-nums; min-width: 1ch; }
.authors__sep { color: var(--ink-2); }

/* ---- Same choices, three countries ---- */
.countries { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; margin-top: 0.5rem; line-height: 1.3; }
.countries th, .countries td { text-align: left; vertical-align: top; padding: 0.3rem 0.8rem; border-bottom: 1px solid var(--rule); }
.countries thead th { font-variant: small-caps; letter-spacing: 0.06em; border-bottom: 3px double var(--ink); position: relative; }
.countries tbody th { font-weight: normal; font-style: italic; color: var(--ink-2); width: 24%; }
.countries .is-live { border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); background: var(--paper-3); }
.countries thead .is-live { border-top: 3px solid var(--ink); }
.countries tbody tr:last-child .is-live { border-bottom: 3px solid var(--ink); }
.countries__star { position: absolute; left: -0.95em; top: 0.15em; font-size: 1.4em; line-height: 1; font-variant: normal; }
.countries__foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 1.5rem; border-top: 3px double var(--rule); margin-top: 0.4rem; padding-top: 0.3rem; }
.countries__key, .disclaimer { margin: 0; }
.disclaimer { font-style: italic; }

/* ---- Close: re-vote (before and after), discussion, end ---- */
.compare { border-collapse: separate; border-spacing: 0; margin-top: 0.8rem; width: 100%; table-layout: fixed; }
.compare th, .compare td { padding: 0.4rem 0.6rem; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--rule); }
.compare thead th { font-weight: normal; vertical-align: top; border-bottom: 3px double var(--ink); }
.compare thead th > span { display: block; margin-top: 0.2rem; }
.compare tbody th { text-align: left; font-variant: small-caps; letter-spacing: 0.08em; width: 10%; }
.compare__cell { display: inline-flex; align-items: center; gap: 0.3em; }
.counter {
  display: inline-block; width: 2.6em; box-sizing: border-box; text-align: center; font-variant-numeric: tabular-nums;
  border: 1px solid var(--ink-2); background: var(--paper-2); padding: 0.1em;
}
.discussion { min-height: 62vh; display: flex; align-items: center; }
.discussion__q { margin: 0; font-size: 2.5rem; line-height: 1.25; max-width: 58rem; }
.endpage { max-width: 60rem; margin: 4vh auto 0; }
.endpage h1 { margin: 0; font-size: 2.8rem; }
.outcome { margin: 1rem 0 0; font-size: 1.35rem; border-left: 3px double var(--ink); padding: 0.2rem 0 0.2rem 0.9rem; max-width: 50rem; }
.data { margin-top: 1.4rem; border-top: 3px double var(--rule); padding-top: 0.6rem; }
.data__label { font-size: 1rem; margin: 0 0 0.3rem; color: var(--ink-2); }
.data__line { margin: 0; font-size: 0.75rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; border: 1px solid var(--rule); background: var(--paper-3); padding: 0.5rem 0.7rem; user-select: all; }
.data__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; margin-top: 0.7rem; }
.data__note { margin: 0; color: var(--ink-2); font-style: italic; }

/* ---- Script panel (S) ---- */
/* In the flow above the footer, so it never covers the option cards: the screen above gives up the room instead. */
[data-region="script"] { flex: none; }
.script {
  max-height: 34vh; overflow: hidden auto; box-sizing: border-box;
  border: 3px double var(--rule); background: var(--paper-3); padding: 0.5rem 1rem; font-size: 0.9rem;
}
.script dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; }
.script dt { font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink-2); }
.script dd { margin: 0; }

/* ---- Glossary links, the drawer's list, Resume offer, teacher notes ---- */
.gloss {
  background: none; border: 0; border-radius: 0; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; text-align: inherit;
  cursor: pointer; text-decoration: underline dotted; text-decoration-thickness: 0.09em; text-underline-offset: 0.2em;
}
.gloss:hover { text-decoration-style: solid; }
.glossary { margin: 0; }
.glossary dt { margin-top: 0.8rem; font-variant: small-caps; letter-spacing: 0.08em; font-weight: bold; }
.glossary dd { margin: 0.1rem 0 0; }
.glossary dt, .glossary dd { padding-left: 0.6rem; border-left: 3px solid transparent; }
.glossary .is-target { border-left-color: var(--ink); }
.resume { border: 3px double var(--rule); background: var(--paper-3); padding: 0.4rem 1rem 0.8rem; margin: 0 0 1.2rem; }
.resume h2 { margin: 0; }
.setup__keys { margin: 1.4rem 0 0; font-size: 0.85rem; color: var(--ink-2); }
.notes { max-width: 52rem; margin: 0 auto; }
.notes__bar { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
.notes h2 { margin-top: 1.5rem; border-bottom: 3px double var(--ink); }
.notes li { margin-bottom: 0.6rem; }
.notes__screen h3 { margin: 1rem 0 0.2rem; }
.notes__script { margin: 0; display: grid; grid-template-columns: 15rem 1fr; gap: 0.15rem 1rem; }
.notes__script dt { font-variant: small-caps; letter-spacing: 0.08em; color: var(--ink); }
.notes__script dd { margin: 0; }

/* ---- Voting cards: on screen only the print sheet is hidden ---- */
.printsheet { display: none; }

@media (max-width: 900px) {
  .game__main.has-book, .cards--bills, .branches, .gz { grid-template-columns: minmax(0, 1fr); }
  #app.is-game { height: auto; overflow: visible; }
  .game__main { grid-template-rows: none; }
  .game__main > .stage, .game__main > [data-region="book"] { max-height: none; overflow: visible; }
  .gz__plate { border-left: 0; padding-left: 0; margin-left: 0; }
  .gz .lawbook__list { columns: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .hemi--fill .hemi__seat { animation: none; fill: currentColor; }
  .prov--new > .prov__body { animation: none; }
  .enact__row .stamp--land { animation-delay: 0s; }
  mark.caught, .charter--reveal, .held__text--type { animation: none; }
}

/* ---- Print (spec §7.2, §12): the voting-card sheet, and the teacher notes ---- */
@page { size: A4 portrait; margin: 10mm; }
@media print {
  html, body, #app { background: #fff; color: #000; }
  .drawer, .script, .noprint { display: none !important; }
  #app { padding: 0; min-height: 0; }
  .notes { max-width: none; font-size: 11pt; line-height: 1.35; }
  .notes h1 { font-size: 20pt; }
  .notes h2 { font-size: 14pt; break-after: avoid; border-bottom-color: #000; }
  .notes li, .notes p, .notes__screen { break-inside: avoid; }
  .notes__screen h3 { font-size: 12pt; break-after: avoid; }
  body[data-print="cards"] #app { display: none !important; }
  body[data-print="cards"] .printsheet { display: block; font-family: var(--serif); color: #000; background: #fff; }
  /* One A4 sheet: four cards in a 2 × 2 grid; the dashed lines are shared cut lines. */
  .printsheet__grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 262mm;
    border-top: 0.4mm dashed #000; border-left: 0.4mm dashed #000;
  }
  .pcard {
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    border-right: 0.4mm dashed #000; border-bottom: 0.4mm dashed #000; break-inside: avoid;
  }
  .pcard__shape { width: 78mm; height: 78mm; display: block; }
  .pcard__name { margin: 4mm 0 0; font-size: 20pt; font-weight: bold; letter-spacing: 0.08em; }
  .printsheet__cut { margin: 3mm 0 0; font-size: 9pt; text-align: center; }
}

/* ---- Review gallery (?gallery=1) ---- */
.gallery section { margin: 2.2rem 0; }
.gallery__bar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 0.6rem 0; }
.gallery__note { color: var(--ink-2); max-width: 48rem; }
.gallery__row { display: flex; flex-wrap: wrap; gap: 1.6rem 2rem; align-items: center; }
.gallery__fig { margin: 0; text-align: center; }
.gallery__fig figcaption { color: var(--ink-2); font-size: 0.85em; }
.gallery__stamps { display: flex; flex-wrap: wrap; gap: 1.6rem 2.4rem; align-items: center; padding: 0.8rem 0.4rem; }
.gallery__swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 0.6rem; }
.gallery__swatch { display: flex; align-items: center; gap: 0.5em; font-size: 0.85em; }
.gallery__chip { width: 1.6em; height: 1.6em; border: 1px solid var(--ink); flex: none; }
.gallery__themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1rem; }
.gallery__pane { padding: 1rem 1.2rem; border: 1px solid var(--rule); }
.gallery__pane > * + * { margin-top: 1rem; }
.gallery__env { padding-top: 7rem; }
</style>

/* ===== BLOCK 4: MODEL ===== */
/* MODEL:START */
const MODEL = (function () {
  // Seeded PRNG (mulberry32). Returns a function yielding floats in [0, 1).
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Stable 32-bit string hash (FNV-1a). Returns an unsigned integer.
  function hashString(str) {
    var h = 0x811C9DC5;
    str = String(str);
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  var BILLS = ["b_narrow", "b_tough", "b_trust"];
  var LISTS = ["l_feeds", "l_wide", "l_all"];
  var CHECKS = ["k_tick", "k_face", "k_id"];
  var MOVES = ["m_comply", "m_chat", "m_quest", "m_lite"];
  var CASE2_RULINGS = ["literal", "purposive"];
  var ACTS = ["I", "II", "III", "IV"];
  // The section of the Act each Case 1 challenges (spec §4.4).
  var CASE_SECTION = { marlow: 2, kim: 1 };
  var RULING_STATUS = { uphold: "IN_FORCE", reinterpret: "REINTERPRETED", declare: "INCOMPATIBLE_IN_FORCE", strike: "VOID" };

  function oneOf(list, v, what) {
    if (list.indexOf(v) === -1) throw new Error("Unknown " + what + ": " + v);
  }
  function fill(tpl, vars) {
    return tpl.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
  }

  // 'A' or 'B', from the seed.
  function constitutionDraw(seed) {
    return mulberry32(seed)() < 0.5 ? "A" : "B";
  }
  // Seed from the date and class label (spec §10). date: "YYYY-MM-DD".
  function seedFrom(date, label) {
    return hashString(String(date) + "|" + String(label || ""));
  }

  // Spec §4.3.
  function moveResult(bill, list, move) {
    oneOf(BILLS, bill, "bill");
    oneOf(MOVES, move, "move");
    if (bill === "b_trust") oneOf(LISTS, list, "list");
    if (move === "m_comply") return "COMPLIED";
    if (bill === "b_tough") return "CAUGHT";
    if (move === "m_lite") return "LOOPHOLE";
    if (bill === "b_narrow") return "ARGUABLE";
    return list === "l_feeds" ? "ARGUABLE" : "CAUGHT";
  }

  function case1For(bill) {
    oneOf(BILLS, bill, "bill");
    return bill === "b_tough" ? "marlow" : "kim";
  }
  function caseSection(id) { return CASE_SECTION[id]; }

  // Spec §4.4. C (comparison only) offers the same set as B.
  function rulingOptions(constitution) {
    oneOf(["A", "B", "C"], constitution, "constitution");
    var opts = [{ id: "uphold", locked: false }, { id: "reinterpret", locked: false }];
    if (constitution === "A") {
      opts.push({ id: "declare", locked: false });
      opts.push({ id: "strike", locked: true, lockReason: CONTENT.lockText });
    } else {
      opts.push({ id: "strike", locked: false });
    }
    return opts;
  }

  function precedentText(caseName, held) {
    return fill(CONTENT.precedent, { "case": caseName, held: held });
  }

  // The {held} wording of a ruling: which 1 (Case 1) or 2 (Case 2). null until that case is decided.
  function heldClause(s, which) {
    if (which === 1) {
      if (!s.case1 || !s.case1.ruling) return null;
      return fill(CONTENT.held[s.case1.ruling], { n: CASE_SECTION[s.case1.id] });
    }
    if (!s.case2 || !s.case2.ruling) return null;
    return fill(CONTENT.held[s.case2.ruling], { app: CONTENT.moves[s.move].app });
  }

  // For a CAUGHT move: the Law Book line (id from lawBook) and the exact words in it that caught Glimmer.
  function caughtBy(bill, list, move) {
    if (moveResult(bill, list, move) !== "CAUGHT") return null;
    if (bill === "b_tough") return { id: "act-1", words: CONTENT.caught.b_tough[move] };
    return { id: "reg-list", words: CONTENT.caught[list][move] };
  }

  // True when Case 1 has struck down §1, the rule itself (Kim under B): §2, the Minister's list and Case 2 have no rule to work on.
  function ruleVoid(s) {
    return !!(s.case1 && s.case1.ruling === "strike" && CASE_SECTION[s.case1.id] === 1);
  }

  // Ordered provisions: the Act's three sections, the Minister's regulations, then precedents.
  // A reinterpreted section keeps Parliament's words; the court's reading is carried beside them (reading),
  // so the change shows as a narrowing, not a new rule. noEffect: the line depends on a void §1.
  function lawBook(s) {
    var out = [], clerk = s.byClerk || {};
    if (!s.bill) return out;
    var bill = CONTENT.bills[s.bill];
    var c1 = s.case1 && s.case1.ruling ? s.case1 : null;
    var challenged = c1 ? CASE_SECTION[c1.id] : 0;
    var noRule = ruleVoid(s);
    for (var n = 1; n <= 3; n++) {
      var p = { id: "act-" + n, author: "PARL", num: "§" + n, text: bill.sections[n - 1], status: "ENACTED", byClerk: !!clerk.bill };
      if (n === challenged) {
        p.status = RULING_STATUS[c1.ruling];
        if (c1.ruling === "reinterpret") p.reading = CONTENT.cases[c1.id].reinterpret;
        p.byClerk = p.byClerk || !!clerk.case1;
      }
      if (n === 2 && noRule) p.noEffect = true;
      out.push(p);
    }
    if (s.list) out.push({ id: "reg-list", author: "MIN", num: "", text: CONTENT.regulations.list[s.list], status: "REGULATION_IN_FORCE", byClerk: !!clerk.list, noEffect: noRule });
    if (s.check) out.push({ id: "reg-check", author: "MIN", num: "", text: CONTENT.regulations.check[s.check], status: "REGULATION_IN_FORCE", byClerk: !!clerk.check });
    if (c1) {
      out.push({
        id: "prec-1", author: "COURT", num: "", status: "PRECEDENT", byClerk: !!clerk.case1,
        text: precedentText(CONTENT.cases[c1.id].name, heldClause(s, 1))
      });
    }
    if (s.case2 && s.case2.ruling) {
      out.push({
        id: "prec-2", author: "COURT", num: "", status: "PRECEDENT", byClerk: !!clerk.case2,
        text: precedentText(CONTENT.case2.name, heldClause(s, 2))
      });
    }
    return out;
  }

  // Live rules by author (VOID excluded).
  function authorship(book) {
    var c = { PARL: 0, MIN: 0, COURT: 0 };
    book.forEach(function (p) { if (p.status !== "VOID") c[p.author] += 1; });
    return c;
  }

  // Final status: COMPLIED, CAUGHT, LOOPHOLE (open), CLOSED_BY_COURT, or NO_RULE (§1 is void); null before Act III.
  function glimmerStatus(s) {

    return '<svg class="padlock" viewBox="0 0 40 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4">' +
      '<path d="M11 21V14A9 9 0 0 1 29 14V21"/><rect x="5" y="21" width="30" height="23"/>' +
      '<circle cx="20" cy="30" r="3.2"/><path d="M20 33V39"/></g></svg>';
  }

  // opts: { letter, text | html (pre-escaped body), selected, action, value, land, note, static, locked, lockText }
  // static: a display-only card (no button), e.g. the hook vote, where no answer is chosen.
  // locked: visible but not choosable; the padlock and the lock text are shown in full.
  function optionCard(o) {
    var body = '<span class="card__mark">' + shape(o.letter) + "</span>" +
      '<span class="card__text">' + (o.html != null ? o.html : esc(o.text)) +
      (o.note ? '<span class="card__note">' + esc(o.note) + "</span>" : "") +
      (o.locked ? '<span class="card__lock">' + padlock() + "<span>" + esc(o.lockText) + "</span></span>" : "") + "</span>";
    if (o.static) return '<div class="card card--static">' + body + "</div>";
    if (o.locked) return '<div class="card card--locked" aria-disabled="true" data-value="' + esc(o.value) + '">' + body + "</div>";
    return '<button type="button" class="card' + (o.selected ? " is-selected" : "") + (o.note ? " is-noted" : "") + '" data-action="' + esc(o.action) +
      '" data-value="' + esc(o.value) + '" data-focus="card-' + esc(o.value) + '" aria-pressed="' + (o.selected ? "true" : "false") + '">' +
      body + (o.selected ? tick(o.value, o.land) : "") + "</button>";
  }

  // A Bill set as a short statute (spec §4.1): title, §1–§3 and the "What this means" line.
  function statute(b) {
    return '<span class="statute"><span class="statute__title">' + esc(b.title) + "</span>" +
      b.sections.map(function (t, i) {
        return '<span class="statute__sec"><span class="prov__num">§' + (i + 1) + "</span>" + esc(t) + "</span>";
      }).join("") +
      '<span class="statute__means"><span class="statute__label">' + esc(CONTENT.bills.meansLabel) + ":</span> " + esc(b.means) + "</span></span>";
  }

  // Parliament's hemicycle. filled: seats fill left to right (staggered), as the Bill passes.
  function hemicycle(filled) {
    var cx = 150, cy = 150, tiers = [58, 76, 94, 112, 130], seats = [], i, j;
    for (i = 0; i < tiers.length; i++) {
      var n = Math.round(tiers[i] / 7.2);
      for (j = 0; j < n; j++) {
        var a = Math.PI - Math.PI * (j + 0.5) / n;
        seats.push({ x: cx + tiers[i] * Math.cos(a), y: cy - tiers[i] * Math.sin(a), a: a });
      }
    }
    seats.sort(function (p, q) { return q.a - p.a; });
    var total = 900;
    return '<svg class="hemi' + (filled ? " hemi--fill" : "") + '" viewBox="0 0 300 165" aria-hidden="true" style="color:var(--parl)">' +
      '<g stroke="currentColor" stroke-width="1.3">' + seats.map(function (p, k) {
        return '<circle class="hemi__seat" cx="' + n1(p.x) + '" cy="' + n1(p.y) + '" r="5" style="--d:' + Math.round(total * k / seats.length) + 'ms"/>';
      }).join("") + "</g>" +
      '<g fill="none" stroke="currentColor"><rect x="138" y="132" width="24" height="12" stroke-width="1.2"/>' +
      '<path stroke-width="2" d="M12 150H288"/><path stroke-width="0.8" d="M20 155H280M30 160H270"/></g></svg>';
  }

  // Reusable Clerk result card (spec §7.5): seal, the decisions taken, a one-line reason, the stamp.
  // c: { kicker, decisions: [{ label, text, note, html (pre-escaped, e.g. a stamp) }], reason }
  function clerkCard(c) {
    return '<article class="clerk">' +
      '<header class="clerk__head">' + seal("CLERK", 112) + '<div><span class="kicker">' + esc(c.kicker) + "</span>" +
      "<h2>" + esc(CONTENT.seals.CLERK) + "</h2></div></header>" +
      '<dl class="clerk__list">' + c.decisions.map(function (d) {
        return "<div><dt>" + esc(d.label) + "</dt><dd>" + esc(d.text) +
          (d.note ? ' <span class="clerk__note">' + esc(d.note) + "</span>" : "") + (d.html || "") + "</dd></div>";
      }).join("") + "</dl>" +
      '<p class="clerk__reason"><span class="clerk__label">' + esc(CONTENT.clerkExtra.reason) + ":</span> " + esc(c.reason) + "</p>" +
      '<div class="clerk__stamp">' + stamp("CLERK", { land: true, scale: 1.5, salt: "card" }) + "</div></article>";
  }

  // options: [{ letter }]; counts: { A: n, ... }
  function tallyStrip(options, counts, action) {
    var ui = CONTENT.ui;
    return '<div class="tally" role="group" aria-label="' + esc(ui.tallyLabel) + '">' + options.map(function (o) {
      var L = esc(o.letter), v = counts[o.letter] || 0;
      return '<div class="tally__item">' + shape(o.letter) +
        '<button type="button" class="tally__btn" data-action="' + action + '" data-option="' + L + '" data-delta="-1" data-focus="tally-' + L +
        '-dec" aria-label="' + esc(ui.tallyFewer + " " + o.letter) + '">−</button>' +
        '<input class="tally__box" type="number" min="0" inputmode="numeric" value="' + v + '" data-tally="' + L +
        '" data-focus="tally-' + L + '" aria-label="' + esc(ui.tallyBox + " " + o.letter) + '">' +
        '<button type="button" class="tally__btn" data-action="' + action + '" data-option="' + L + '" data-delta="1" data-focus="tally-' + L +
        '-inc" aria-label="' + esc(ui.tallyMore + " " + o.letter) + '">+</button></div>';
    }).join("") + "</div>";
  }

  // Text with one exact phrase marked (e.g. the words that caught Glimmer).
  function marked(text, words) {
    var i = words ? text.indexOf(words) : -1;
    if (i === -1) return esc(text);
    return esc(text.slice(0, i)) + '<mark class="caught">' + esc(words) + "</mark>" + esc(text.slice(i + words.length));
  }

  // provisions: [{ author, num, text, stamps: [key], struck, land, mark, note, brief }]; title: optional subheading (the Act's title).
  // brief: a line not in play on this screen, its text shown on one line, so the lines that matter fit.
  // land: the provision has just entered the Law Book (or changed); it slides in and its stamps land.
  // mark: exact words in text to highlight; note: a line beneath the text.
  // opts: { compact } — tighter rows, for when the Law Book is at its longest.
  // Stamps are "even": every word at LAW_STAMP_EM of the Law Book's text size, so the status reads from a seat.
  // They sit at the right of the line's text, which wraps beside and then below them.
  var LAW_STAMP_EM = 0.88;
  function lawBook(provisions, title, opts) {
    var compact = opts && opts.compact, scale = LAW_STAMP_EM;
    return '<article class="lawbook' + (compact ? " lawbook--compact" : "") + '" aria-label="' + esc(CONTENT.chrome.lawBook) + '">' +
      '<header class="lawbook__head"><h2>' + esc(CONTENT.chrome.lawBook) + "</h2>" +
      (title ? '<p class="lawbook__title">' + esc(title) + "</p>" : "") + "</header>" +
      '<ol class="lawbook__list">' + provisions.map(function (p, i) {
        return '<li class="prov' + (p.struck ? " prov--struck" : "") + (p.land ? " prov--new" : "") + (p.brief ? " prov--brief" : "") + '">' +
          '<div class="prov__gutter">' + seal(p.author, 52) + "</div>" +
          '<div class="prov__body">' +
          ((p.stamps || []).length ? '<span class="prov__stamps">' + p.stamps.map(function (k) {
            return stamp(k, { salt: "lb" + i, scale: scale, land: p.land, even: true });
          }).join("") + "</span>" : "") +
          '<span class="prov__line">' + (p.num ? '<span class="prov__num">' + esc(p.num) + "</span>" : "") +
          '<span class="prov__text">' + marked(p.text, p.mark) + "</span></span>" +
          (p.note ? '<span class="prov__note">' + esc(p.note) + "</span>" : "") + "</div></li>";
      }).join("") + "</ol></article>";
  }

  // c: { ref, name, facts, args: [{who, text}], held, type }; type: the Held line types itself out.
  function caseFolder(c) {
    return '<article class="folder"><div class="folder__tab tw">' + esc(c.ref) + "</div>" +
      '<h3 class="folder__name">' + esc(c.name) + "</h3>" +
      '<p class="folder__facts">' + esc(c.facts) + "</p>" +
      (c.args && c.args.length ? '<dl class="folder__args">' + c.args.map(function (a) {
        return "<div><dt>" + esc(a.who) + "</dt><dd>" + esc(a.text) + "</dd></div>";
      }).join("") + "</dl>" : "") +
      '<p class="held"><span class="held__label">' + esc(CONTENT.chrome.held) + '</span><span class="held__line tw">' +
      (c.held ? '<span class="held__text' + (c.type ? " held__text--type" : "") + '">' + esc(c.held) + "</span>" : "") + "</span></p>" +
      "</article>";
  }

  // The constitution card (spec §5): letter, name, "loosely inspired by", and the summary read aloud.
  // reveal: it appears after the envelope's seal has cracked.
  function charter(id, reveal) {
    var c = CONTENT.constitutions[id], X = CONTENT.actExtra;
    return '<article class="charter' + (reveal ? " charter--reveal" : "") + '">' +
      '<span class="kicker">' + esc(X.constitution) + "</span>" +
      "<h2>" + esc(X.letter.replace("{c}", id)) + " — " + esc(c.name) + "</h2>" +
      '<p class="charter__inspired">(' + esc(c.inspired) + ")</p>" +
      '<p class="charter__summary">' + esc(c.summary) + "</p></article>";
  }

  // Wax blob outline: a circle with a seeded-looking but fixed wobble.
  function waxPath(cx, cy, r) {
    var pts = [];
    for (var i = 0; i < 72; i++) {
      var th = TAU * i / 72;
      var rr = r + 1.8 * Math.sin(5 * th) + 1.2 * Math.sin(9 * th + 1) + 0.8 * Math.sin(13 * th + 2);
      pts.push([cx + rr * Math.cos(th), cy + rr * Math.sin(th)]);
    }
    return pathFrom(pts);
  }

  var CRACK = [[124, 110], [136, 116], [142, 108], [151, 119], [158, 112], [166, 124], [173, 117], [182, 127], [197, 122]];
  function crackRegion(far) {
    var d = "M" + CRACK.map(function (p) { return p[0] + " " + p[1]; }).join("L");
    return d + "L202 " + far + "L118 " + far + "Z";
  }

  // Envelope; the constitution is sealed with wax that cracks along an SVG path.
  // Add the class env--open (after insertion) to crack the seal and open the flap.
  function envelope(enterOpen) {
    var id = uid("e"), wax = waxPath(160, 118, 30);
    var waxBody = '<path d="' + wax + '" fill="var(--court)"/>' +
      '<g fill="none" stroke="var(--paper-3)" opacity="0.55"><circle cx="160" cy="118" r="22" stroke-width="1.2"/>' +
      '<path stroke-width="0.5" d="' + hypotrochoid(9, 2, 1.8, 9, 19, 0, 160, 118) + '"/></g>';
    return '<div class="env"' + (enterOpen ? ' data-enter="env--open"' : "") + ">" +
      '<svg viewBox="0 0 320 200" role="img" aria-label="' + esc(CONTENT.ui.envelope) + '" style="color:var(--rule)">' +
      "<defs>" +
      '<pattern id="' + id + 'h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<path d="M0 0V4" stroke="currentColor" stroke-width="0.6"/></pattern>' +
      '<clipPath id="' + id + 'a"><path d="' + crackRegion(70) + '"/></clipPath>' +
      '<clipPath id="' + id + 'b"><path d="' + crackRegion(170) + '"/></clipPath>' +
      "</defs>" +
      '<rect x="10" y="0" width="300" height="190" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="1.5"/>' +
      '<path d="M10 0L120 104L10 190Z" fill="url(#' + id + 'h)"/><path d="M310 0L200 104L310 190Z" fill="url(#' + id + 'h)"/>' +
      '<path d="M10 190L160 100L310 190" fill="none" stroke="var(--ink-2)" stroke-width="1"/>' +
      '<g class="env__waxB" clip-path="url(#' + id + 'b)">' + waxBody + "</g>" +
      '<g class="env__flap">' +
      '<path d="M10 0L160 118L310 0Z" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="1.5"/>' +
      '<path d="M24 0L160 107L296 0" fill="none" stroke="var(--rule)" stroke-width="0.6"/>' +
      '<g class="env__waxA" clip-path="url(#' + id + 'a)">' + waxBody + "</g>" +
      "</g>" +
      '<path class="env__crack" pathLength="1" fill="none" stroke="var(--ink)" stroke-width="1.6" d="M' +
      CRACK.map(function (p) { return p[0] + " " + p[1]; }).join("L") + '"/>' +
      "</svg></div>";
  }

  // Ribbon is built once and its tied stage switched by class, so the tape can untie and retie.
  function ribbon() {
    var knot = '<svg class="tape__knot" viewBox="0 0 24 30" aria-hidden="true">' +
      '<g fill="var(--tape)" stroke="var(--ink)" stroke-width="0.6" stroke-linejoin="round">' +
      '<path d="M11 12L6.5 27.5L9 26L10.2 28.5L13 12.5Z"/><path d="M13 12L17.5 27L15 25.8L13.8 28.2L11 12.5Z"/>' +
      '<path d="M12 10C7 3.5 1.5 6 3 11C4.5 15 9 13 12 10Z"/><path d="M12 10C17 3.5 22.5 6 21 11C19.5 15 15 13 12 10Z"/>' +
      '<rect x="9.8" y="8" width="4.4" height="4.4"/></g></svg>';
    return '<nav class="ribbon" aria-label="' + esc(CONTENT.ui.ribbonLabel) + '"><ol>' +
      CONTENT.chrome.stages.map(function (s, i) {
        return (i ? '<li class="ribbon__arrow" aria-hidden="true">→</li>' : "") +
          '<li class="ribbon__stage" data-stage="' + i + '"><span class="tape" aria-hidden="true"><span class="tape__band"></span>' +
          knot + "</span>" + esc(s) + "</li>";
      }).join("") + "</ol></nav>";
  }

  // roleKey: a key of CONTENT.roles; sealAuthor may be null (Citizens carry no seal).
  function rolePlate(roleKey, sealAuthor) {
    return '<div class="plate">' + (sealAuthor ? seal(sealAuthor, 54) : "") +
      '<div><span class="plate__kicker">' + esc(CONTENT.chrome.youAreNow) + '</span><span class="plate__role">' +
      esc(CONTENT.roles[roleKey]) + "</span></div></div>";
  }

  function formatClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function clockLevel(sec) { return sec >= 1800 ? "oxblood" : sec >= 1500 ? "brass" : "normal"; }
  function clock(sec, live) {
    return '<div class="clock clock--' + clockLevel(sec) + '" role="timer" aria-label="' + esc(CONTENT.ui.clockLabel) + '"' +
      (live ? " data-clock-live" : "") + '><span class="clock__time">' + formatClock(sec) +
      '</span><span class="clock__limit"> / ' + esc(CONTENT.chrome.sessionLimit) + "</span></div>";
  }

  function slug(term) { return term.toLowerCase().replace(/[^a-z]+/g, "-"); }

  // The drawer lists every term (spec §8). A term opened from the lesson text is marked by class, so focus is not disturbed.
  function glossaryDrawer() {
    return '<div class="drawer__head"><h2 id="glossary-title" tabindex="-1">' + esc(CONTENT.ui.glossaryTitle) + "</h2>" +
      '<button type="button" class="btn" data-action="glossary-close">' + esc(CONTENT.ui.glossaryClose) + "</button></div>" +
      '<dl class="glossary">' + CONTENT.glossary.map(function (g) {
        return '<dt id="gloss-' + slug(g.term) + '" data-term="' + esc(g.term) + '">' + esc(g.term) + '</dt><dd data-term="' + esc(g.term) + '">' +
          esc(g.def) + "</dd>";
      }).join("") + "</dl>";
  }

  // ---- Glossary links: the first use of each term on a screen opens its definition (spec §8) ----
  var termPats = null;
  function termPatterns() {
    if (termPats) return termPats;
    termPats = CONTENT.glossary.map(function (g) {
      var alt = g.forms.slice().sort(function (a, b) { return b.length - a.length; })
        .map(function (f) { return f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|");
      // An exact term ("Act") is the capitalised word only, and not the start of a numbered act ("Act III").
      return { term: g.term, re: new RegExp("\\b(?:" + alt + ")\\b" + (g.exact ? "(?! (?:I|II|III|IV)\\b)" : ""), g.exact ? "" : "i") };
    });
    return termPats;
  }

  // Inside a button (an option card) a link cannot be a second button, so it is a plain span; the click still reaches it.
  function glossLink(term, shown, inside) {
    var attrs = ' class="gloss" data-action="glossary-open" data-value="' + esc(term) + '"';
    return inside ? "<span" + attrs + ">" + shown + "</span>"
      : '<button type="button"' + attrs + ' data-focus="gloss-' + slug(term) + '">' + shown + "</button>";
  }

  function linkText(text, pats, seen, inside) {
    var hits = [];
    pats.forEach(function (p) {
      if (seen[p.term]) return;
      var m = p.re.exec(text);
      if (m) hits.push({ term: p.term, at: m.index, len: m[0].length });
    });
    if (!hits.length) return text;
    hits.sort(function (a, b) { return a.at - b.at; });
    var out = "", pos = 0;
    hits.forEach(function (x) {
      if (x.at < pos) return; // overlaps an earlier link; the term stays unseen for the next piece of text
      seen[x.term] = true;
      out += text.slice(pos, x.at) + glossLink(x.term, text.substr(x.at, x.len), inside);
      pos = x.at + x.len;
    });
    return out + text.slice(pos);
  }

  // Links the first use of each glossary term in the text of an HTML string. seen ({ term: true }) carries
  // across the pieces of one screen. Drawings (svg), the DATA line (pre) and existing controls' markup are left alone.
  function linkTerms(html, seen) {
    seen = seen || {};
    var pats = termPatterns(), parts = html.split(/(<[^>]*>)/), out = "", svg = 0, hold = 0, ctl = 0;
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (i % 2) {
        var m = /^<(\/?)([a-zA-Z][a-zA-Z0-9]*)/.exec(part);
        if (m) {
          var name = m[2].toLowerCase(), d = m[1] ? -1 : 1;
          if (name === "svg") svg += d;
          else if (name === "button" || name === "a") ctl += d;
          else if (name === "pre" || name === "script" || name === "style" || name === "textarea") hold += d;
        }
        out += part;
      } else out += svg > 0 || hold > 0 || !part ? part : linkText(part, pats, seen, ctl > 0);
    }
    return out;
  }

  // Spec §12 uses *italic* and **bold** (case names, lead-ins).
  function inlineMd(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  // The facilitator script for every screen (spec §7.4), with its variants, for the printed notes.
  function scriptNotes() {
    var S = CONTENT.script, A = CONTENT.actExtra, X = CONTENT.teacherExtra;
    function row(label, text) { return "<dt>" + esc(label) + "</dt><dd>" + esc(text) + "</dd>"; }
    return Object.keys(CONTENT.screens).filter(function (k) { return k !== "authored" && S[k]; }).map(function (k) {
      var e = S[k], h = row(A.timing, e.timing) + row(A.say, e.say);
      if (k === "case1") h += row(X.underA + " — " + A.ask, CONTENT.lockQuestion);
      if (k === "gap") h += row(X.afterComply + " — " + A.ask, e.askComplied);
      h += row(A.likely, e.q) + row(A.answer, e.a);
      if (k === "case1") h += row(X.underB + " — " + A.likely, e.qB) + row(X.underB + " — " + A.answer, e.aB);
      if (k === "nocase") h += row(X.ifVoid + " — " + A.say, e.sayVoid) + row(X.ifVoid + " — " + A.likely, e.qVoid) + row(X.ifVoid + " — " + A.answer, e.aVoid);
      return '<section class="notes__screen"><h3>' + esc(CONTENT.screens[k]) + '</h3><dl class="notes__script">' + h + "</dl></section>";
    }).join("");
  }

  // Teacher notes (spec §12 verbatim, then §1.3, then the per-screen script). The same markup is read on screen and printed.
  function teacherNotes() {
    var T = CONTENT.teacher, X = CONTENT.teacherExtra;
    function li(t) { return "<li>" + inlineMd(t) + "</li>"; }
    return '<article class="notes"><div class="notes__bar noprint">' +
      '<button type="button" class="btn" data-action="view-close" data-focus="view-close">' + esc(X.back) + "</button>" +
      '<button type="button" class="btn btn--primary" data-action="print-notes" data-focus="print-notes">' + esc(X.print) + "</button></div>" +
      "<h1>" + esc(CONTENT.setup.teacherNotes) + "</h1>" +
      "<section><h2>" + esc(T.anchorsHeading) + "</h2><ul>" + T.anchors.map(li).join("") + "</ul></section>" +
      "<section><h2>" + esc(T.simplificationsHeading) + "</h2><p>" + inlineMd(T.simplifications) + "</p></section>" +
      "<section><h2>" + esc(T.qualificationsHeading) + "</h2><ol>" + T.qualifications.map(li).join("") + "</ol></section>" +
      "<section><h2>" + esc(X.scriptHeading) + "</h2>" + scriptNotes() + "</section></article>";
  }

  // One voting card for the print sheet (spec §7.2): a solid black shape with the letter reversed out, so it
  // reads in black and white and from the back of a room. Drawn in SVG so it prints without background graphics.
  function printCard(letter) {
    var ty = letter === "C" ? 77.5 : 66.25, fs = letter === "C" ? 35 : 42.5, name = CONTENT.printCards.shapes[letter];
    return '<div class="pcard"><svg class="pcard__shape" viewBox="0 0 100 100" role="img" aria-label="' + esc(letter + " — " + name) + '">' +
      '<g transform="scale(2.5)" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="miter">' + SHAPES[letter] + "</g>" +
      '<text x="50" y="' + ty + '" text-anchor="middle" font-size="' + fs + '" font-weight="bold" fill="#fff" style="font-family:var(--serif)">' +
      letter + "</text></svg>" +
      '<p class="pcard__name">' + esc(letter + " — " + name) + "</p></div>";
  }

  // One A4 sheet, four cards in a 2 × 2 grid with shared dashed cut lines.
  function printSheet() {
    var P = CONTENT.printCards;
    return '<section class="printsheet" id="print-cards" aria-hidden="true"><div class="printsheet__grid">' +
      ["A", "B", "C", "D"].map(printCard).join("") + '</div><p class="printsheet__cut">' + esc(P.sheet + ". " + P.cut) + "</p></section>";
  }

  // The Gazette's engraved Parliament building (spec §9.3 item 7): portico, dome, wings, steps.
  // Line engraving with hatched shading only; currentColor is the ink.
